[pytest]
pythonpath = backend
testpaths = tests
norecursedirs = runtime release release-cn release-cn-no-voice node_modules dist
markers =
    unit: deterministic isolated tests without network or GUI
    contract: API, schema, security, migration, and boundary contracts
    integration: multi-component local process and HTTP integration
    live_provider: tests requiring a real external provider or real Agent CLI
    desktop: Electron or packaged desktop interaction tests
    release: packaging, runtime, supply-chain, updater, and installer tests
    private_eval: sealed held-out evaluation executed outside the developer trust boundary
