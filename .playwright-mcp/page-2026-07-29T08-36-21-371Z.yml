                - generic [ref=e2038]: "[tool result] read: {\"path\": \"_utils/figure_exemplars.md\", \"start_line\": 1, \"end_line\": 160, \"total_lines\": 550, \"content\": \"# 优秀论文图表分布范例\\n\\nClaude 在规划图表时参考此文件。根据当前论文/竞赛类型，找到对应的范例部分。\\n比例和数量仅供参考，根据具体内容自主调整。\\n\\n---\\n\\n## ⛔ TikZ 架构图分布规律（所有论文类型通用）\\n\\nTikZ 图是论文结构的重要组成部分。不同章节位置对应不同类型的 TikZ 图，规划时参考以下分布规律自主决定：\\n\\n### 位置一：绪论/引言（推荐）\\n\\n**类型：技术路线图 / 研究框架图**\\n- 作用：让读者一眼看清整个研究的逻辑链路，从\\\"问题→方法→验证→结论\\\"的宏观视角\\n- 学术论文：研究框架图（研究问题→理论基础→方法设计→实验验证→结论）或技术路线图（数据采集→预处理→模型构建→训练→评估→部署）\\n- 统计建模：研究路线图（问题提出→文献梳理→假设建立→数据收集→实证分析→稳健性检验→结论）\\n- 数模竞赛：问题关系图（子问题间的依赖/递进/并行关系，标注数据流向）\\n- 风格：自上而下或自左向右的流程，节点用圆角矩形，箭头标注关键信息\\n\\n### 位置二：方法/模型章节（推荐）\\n\\n**类型：模型架构图 / 算法流程图 / 求解流程图**\\n- 作用：展示核心方法的内部结构和数据流\\n- 学术论文 CS/AI：整体模型架构图（输入→编码器→核心模块→解码器→输出），复杂模块可单独画细节图\\n- 学术论文 经管/统计：理论模型框架图（自变量→中介变量→因变量的路径关系，标注假设 H1/H2/H3）\\n- 统计建模：分析框架图（变量关系→模型选择→估计方法的逻辑）\\n- 数模竞赛：每个子问题的求解流程图（输入数据→预处理→建模→求解→输出结果）\\n- 风格：模块化布局，用不同颜色区分功能模块，箭头标注数据维度/变换\\n\\n### 位置三：实验/实证章节（可选，推荐）\\n\\n**类型：实验设计图 / 对比框架图**\\n- 作用：展示实验设计的整体结构（数据集划分、评估流程、对比方案）\\n- 适用场景：实验设计复杂（多阶段、多数据集、交叉验证）时特别有用\\n- 数模竞赛：灵敏度分析框架（哪些参数、变化范围、评估指标）\\n\\n### 各论文类型 TikZ 图参考建议\\n\\n| 论文类型 | 绪论 TikZ | 方法 TikZ | 参考合计 |\\n|----------|-----------|-----------|----------|\\n| 学术论文（硕士 CS/AI） | 1 研究框架图 | 1 架构图 + 1-2 模块图 | 3-4 |\\n| 学术论文（硕士 经管） | 1 研究路线图 | 1 理论框架图 | 2 |\\n| 学术论文（本科） | 1 技术路线图 | 1 架构图 | 2 |\\n| 学术论文（期刊 ICLR 等） | 0-1 | 1 架构图 | 1 |\\n| 统计建模大赛 | 1 ... [truncated 6151 characters] ... 有负的增益/偏离→发散柱状图；\\\"越小越好\\\"的指标(NIQE/BRISQUE/RMSE/误差)进雷达图或综合评价前，**必须先反向归一化**统一成\\\"越大越好\\\"，否则面积/排名会误导。\\n3. ⛔ **要素完整**：坐标轴标题+单位、图例、中文标注(与正文一致)、必要时误差棒/置信区间；统计推断类结果不给不确定性=不可信。\\n4. ⛔ **最终清单零 TODO**：FIGURE_MANIFEST 和图表清单里不得残留 `TODO`/`待定`/占位类型，规划阶段就把每张图的类型定死。\\n\\n---\\n\\n## 竞赛论文\\n\\n### 国赛 CUMCM A 题（优化类，25-30 页正文）\\n\\n- 问题重述+分析(2-3页)：1 问题关系图(TikZ) + 1 数据特征表\\n- 模型假设+符号说明(1-2页)：1 符号表（三线表，15-25 个变量，含符号/含义/单位三列，不拆开）+ 模型假设 5-7 条\\n- 问题一(5-7页)：1 模型流程图(TikZ) + 2 求解结果表 + 3 结果可视化图(PDF，含空间分布/时序变化/对比) + 1 灵敏度分析图(PDF)\\n- 问题二(5-7页)：1 结果表 + 3 对比图(PDF，含优化前后对比/参数影响/收敛曲线) + 1 参数分析图(PDF) + 1 布局/方案图(PDF)\\n- 问题三(5-7页)：1 结果表 + 3 可视化图(PDF，含最优方案展示/对比分析/分布图) + 1 参数敏感性图(PDF)\\n\", \"ok\": true}"
