'中心被遮蔽 = 整体被遮蔽'的等价假设（除非证明等价性）\\n- 离散采样近似时必须做收敛性验证（如 N=100→300→500 结果稳定才算收敛）\\n- 代码注释必须说明：判定的是哪个几何体的哪些边界（如'圆柱体上下底面圆周 300 点'）\\n\\n\", \"ok\": true}"
