                - generic [ref=e2478]: "[tool result] read: {\"path\": \"_utils/figure_exemplars.md\", \"start_line\": 1, \"end_line\": 180, \"total_lines\": 550, \"content\": \"# 优秀论文图表分布范例\\n\\nClaude 在规划图表时参考此文件。根据当前论文/竞赛类型，找到对应的范例部分。\\n比例和数量仅供参考，根据具体内容自主调整。\\n\\n---\\n\\n## ⛔ TikZ 架构图分布规律（所有论文类型通用）\\n\\nTikZ 图是论文结构的重要组成部分。不同章节位置对应不同类型的 TikZ 图，规划时参考以下分布规律自主决定：\\n\\n### 位置一：绪论/引言（推荐）\\n\\n**类型：技术路线图 / 研究框架图**\\n- 作用：让读者一眼看清整个研究的逻辑链路，从\\\"问题→方法→验证→结论\\\"的宏观视角\\n- 学术论文：研究框架图（研究问题→理论基础→方法设计→实验验证→结论）或技术路线图（数据采集→预处理→模型构建→训练→评估→部署）\\n- 统计建模：研究路线图（问题提出→文献梳理→假设建立→数据收集→实证分析→稳健性检验→结论）\\n- 数模竞赛：问题关系图（子问题间的依赖/递进/并行关系，标注数据流向）\\n- 风格：自上而下或自左向右的流程，节点用圆角矩形，箭头标注关键信息\\n\\n### 位置二：方法/模型章节（推荐）\\n\\n**类型：模型架构图 / 算法流程图 / 求解流程图**\\n- 作用：展示核心方法的内部结构和数据流\\n- 学术论文 CS/AI：整体模型架构图（输入→编码器→核心模块→解码器→输出），复杂模块可单独画细节图\\n- 学术论文 经管/统计：理论模型框架图（自变量→中介变量→因变量的路径关系，标注假设 H1/H2/H3）\\n- 统计建模：分析框架图（变量关系→模型选择→估计方法的逻辑）\\n- 数模竞赛：每个子问题的求解流程图（输入数据→预处理→建模→求解→输出结果）\\n- 风格：模块化布局，用不同颜色区分功能模块，箭头标注数据维度/变换\\n\\n### 位置三：实验/实证章节（可选，推荐）\\n\\n**类型：实验设计图 / 对比框架图**\\n- 作用：展示实验设计的整体结构（数据集划分、评估流程、对比方案）\\n- 适用场景：实验设计复杂（多阶段、多数据集、交叉验证）时特别有用\\n- 数模竞赛：灵敏度分析框架（哪些参数、变化范围、评估指标）\\n\\n### 各论文类型 TikZ 图参考建议\\n\\n| 论文类型 | 绪论 TikZ | 方法 TikZ | 参考合计 |\\n|----------|-----------|-----------|----------|\\n| 学术论文（硕士 CS/AI） | 1 研究框架图 | 1 架构图 + 1-2 模块图 | 3-4 |\\n| 学术论文（硕士 经管） | 1 研究路线图 | 1 理论框架图 | 2 |\\n| 学术论文（本科） | 1 技术路线图 | 1 架构图 | 2 |\\n| 学术论文（期刊 ICLR 等） | 0-1 | 1 架构图 | 1 |\\n| 统计建模大赛 | 1 ... [truncated 6921 characters] ... 据图 63% | 表格 29% | 架构图 8%\\n\\n### 国赛 CUMCM B 题（综合应用类，25-30 页正文）\\n\\n- 问题重述+分析(2-3页)：1 问题关系图(TikZ) + 1 数据概况表\\n- 模型假设+符号说明(1-2页)：1 符号表（三线表，15-20 个变量，含符号/含义/单位三列，不拆开）+ 模型假设 5-7 条\\n- 问题一(5-7页)：1 数据预处理图(PDF) + 1 描述性统计表 + 2 数据特征图(PDF，含分布/趋势) + 1 模型结果表\\n- 问题二(5-7页)：1 模型流程图(TikZ) + 1 结果表 + 2 可视化图(PDF，含对比/预测) + 1 误差分析图(PDF)\\n- 问题三(5-7页)：1 结果表 + 2 方案对比图(PDF) + 1 优化结果图(PDF) + 1 参数分析图(PDF)\\n- 灵敏度分析(2-3页)：2 参数变化曲线图(PDF) + 1 灵敏度汇总表\\n- 模型评价(2页)：1 优缺点对比表 + 1 综合对比图(PDF)\\n- 合计：13 数据图(PDF) + 6 表格 + 2 架构图(TikZ) = 21 个\\n- 比例：数据图 62% | 表格 29% | 架构图 9%\\n\\n### 国赛 CUMCM C 题（数据分析类，25-30 页正文）\\n\\n- 问题一(5-7页)：2 数据分布图(PDF) + 1 时序趋势图(PDF) + 1 描述性统计表 + 1 相关性热力图(PDF)\\n\", \"ok\": true}"
