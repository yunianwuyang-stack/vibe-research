                - generic [ref=e2944]: "[tool result] read: {\"path\": \"PROBLEM_ANALYSIS.md\", \"start_line\": 1, \"end_line\": 370, \"total_lines\": 370, \"content\": \"# 2025 年高教社杯全国大学生数学建模竞赛 C 题分析报告\\n\\n## 一、赛题概述\\n\\n**本赛题共 4 个子问题。** 题目研究无创产前检测（NIPT）的检测时点选择与胎儿异常判定。附件按胎儿性别分为两组：男胎数据含 Y 染色体 Z 值和 Y 染色体浓度，女胎数据的 Y 字段为空；两组均包含孕妇基本信息、孕周、测序质量、13/18/21 号染色体 Z 值、X 染色体信息、非整倍体标签及出生后健康结果。\\n\\n题面给出的临床规则是：可检测孕周约为 10--25 周；男胎 Y 染色体浓度达到或超过 $4\\\\%$ 时，NIPT 结果基本准确；早期（12 周以内）发现异常风险较低，中期（13--27 周）风险高，晚期（28 周以后）风险极高。男胎的达标时间与孕周、BMI 以及身高、体重、年龄等因素相关。实际数据存在测序失败、多次采血和一次采血多次检测，因此不能把所有行简单视为相互独立的个体样本。\\n\\n核心决策链为：\\n\\n$$\\n\\\\text{质量控制} \\\\rightarrow \\\\text{男/女胎分层} \\\\rightarrow \\\\text{Y浓度建模或异常分类} \\\\rightarrow \\\\text{时点/判定规则} \\\\rightarrow \\\\text{误差与稳健性评估}.\\n$$\\n\\n## 二、四个子问题拆解\\n\\n| 子问题 | 输入 | 输出 | 难度 | 建议方法 | 关系 |\\n|---|---|---|---|---|---|\\n| 问题1 | 男胎孕周、BMI、Y 浓度、年龄、身高、体重及质量指标 | Y 浓度与孕周/BMI 等的关系模型、显著性检验 | 中等 | 相关分析 + GAM/混合效应回归 + 稳健性检验 | 基础分析，供问题2/3 使用 |\\n| 问题2 | 男胎 BMI、孕周与 Y 浓度达标记录 | BMI 分组、组内最佳检测时点、检测误差影响 | 困难 | 首达标时间/达标概率模型 + 动态规划或约束优化 | 依赖问题1，突出 BMI |\\n| 问题3 | 男胎全部协变量、达标比例和测量误差 | 多因素 BMI 分组及最佳时点、误差敏感性 | 困难 | 生存/离散时间模型 + 混合效应/Bootstrap + 多目标优化 | 在问题2上升级，避免重复使用问题2结论 |\\n| 问题4 | 女胎 13/18/21 号非整倍体标签、X/Z/GC/读段/BMI | 女胎异常判定方法、阈值和验证结果 | 困难 | 分层逻辑回归/树模型对比 + 代价敏感分类 + 校准 | 与问题1--3相对独立，但共享质控流程 |\\n\\n### 子问题依赖与递进\\n\\n问题1先确定孕周和 BMI 对 Y 浓度的主效应、非线性及个体内相关结构；问题2将连续浓度关系转化为“首次达到 $4\\\\%$”的分组时点决策；问题3加入个人特征、达标比例和测量误差，允许分 ... [truncated 12863 characters] ... nt_curves\\n- fig_q2_group_timing\\n- fig_q2_error_sensitivity\\n- fig_q3_feature_importance\\n- fig_q3_model_compare\\n- fig_q3_pareto_front\\n- fig_q3_robustness\\n- fig_q4_confusion_matrix\\n- fig_q4_roc_pr\\n- fig_q4_calibration\\n- fig_q4_risk_score\\n\\n**DrawIO 流程/架构图（paper-figure-drawio 产出 .drawio + .png/.pdf）：**\\n- fig_roadmap\\n- fig_flow_q1\\n- fig_flow_q2\\n- fig_flow_q3\\n- fig_flow_q4\\n- fig_pipeline\\n- fig_model_decision\\n\\n**TikZ 图（paper-figure 产出 tikz_*.pdf）：**\\n- tikz_q2_feasible\\n- tikz_q3_pareto\\n\\n**GPT Image 场景图（paper-illustration 产出 .png）：**\\n\\n**总数：DATA=17, DRAWIO=7, TIKZ=2, GPTIMG=0, ALL=26**\\n<!-- END FIGURE_MANIFEST -->\\n\", \"ok\": true}"
