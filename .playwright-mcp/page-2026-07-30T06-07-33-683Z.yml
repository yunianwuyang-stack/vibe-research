                - generic [ref=e2176]: "[tool] replace {\"new_text\": \"### 9.4 防错手册专项审查凭证\\n\\n- **约束闭环**：结果导出后按最终物理/业务量重算 C1--C14；`constraints_ok` 不继承求解器中间标记。动态量 `p_g(t)` 必须由“患者当前可获得协变量 + 当前时点 + 式(20)风险率”派生，禁止用固定 BMI 组均值替代。\\n- **单位与图表**：孕周统一为周，BMI 为 kg/m$^2$，身高 cm，体重 kg，浓度/比例为无量纲比例，读段数为条；跨子问题不发生隐式换算，所有图表轴标注单位或“无量纲”。\\n- **切分与防泄漏**：先按孕妇代码划分外层集合，再在训练折拟合填补、缩放、VIF、PCA、模型和校准器；首次检测决策只使用该时点已可获得的字段，AB、AE 和未来记录不进入特征。\\n- **随机性与复现**：固定 `MASTER_SEED=20250912`，同步设置 Python 和 NumPy seed，记录运行时间、解释器和关键库版本；每个 Bootstrap/误差场景按 fold 与 replicate 派生种子并按编号合并。\\n- **收敛性**：GAMM/混合效应拟合至少 5 个初始化，比较 REML/对数似然、梯度或残差；动态规划报告状态数、上下界和 DP 与全枚举的一致性；分类模型记录内层调参、校准和外层指标，不能只依赖 `success=True`。\\n\\n\", \"old_text\": \"## 10. 结果约束清单\", \"path\": \"MODELING_REPORT.md\", \"replace_all\": false}"
