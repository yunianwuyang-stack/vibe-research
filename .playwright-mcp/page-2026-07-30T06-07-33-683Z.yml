                - generic [ref=e1336]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 501, \"end_line\": 726, \"total_lines\": 726, \"content\": \"\\n传统 $|Z|\\\\ge3$ 规则作为临床可解释基线，不作为默认真值。分别对 T13、T18、T21 采用 one-vs-rest 弹性网；若某类型阳性患者少于 10，仅报告基线规则和二分类模型风险，不拟合不稳定的亚型分类器。\\n\\n### 8.4 评价与外部一致性\\n\\n外层使用重复 5 折 StratifiedGroupKFold，共 5 次重复，固定种子。主指标为 PR-AUC、灵敏度和 Brier；辅助报告 ROC-AUC、特异度、PPV、NPV、F1、校准截距/斜率和 95% 患者 Bootstrap 区间。混淆矩阵按患者聚合且将“需重采”单列。\\n\\n决策曲线净收益为\\n\\n$$\\nNB(\\\\theta)=\\\\frac{TP(\\\\theta)}{N}-\\\\frac{FP(\\\\theta)}{N}\\\\frac{\\\\theta}{1-\\\\theta}, \\\\tag{33}\\n$$\\n\\n只在训练时预定的临床阈值区间 $[0.05,0.50]$ 内与“全部干预、均不干预”比较。AE 在所有模型、校准器和阈值冻结后才做一致性检查，报告 AB 风险与 AE 的列联表和关联区间；AE 不能反向修改模型。\\n\\n鲁棒性分析依次固定为：GC 警戒开/关；完整案例、训练折中位数填补和 IPCW；成本比 2、5、10；患者概率聚合用最大值、首次值、最近值；Z 值缩尾开/关。若结论方向在超过 20% 的预设情景中翻转，则只报告概率和区间，不给单一硬阈值结论。\\n\\n## 9. 模型检验、灵敏度与鲁棒性总方案\\n\\n### 9.1 统计检验与泛化检验\\n\\n所有训练、预处理和阈值选择均在患者代码层面完成。男胎浓度模型的主指标为患者级外层测试 RMSE，辅助指标为 MAE、解释偏差、残差均值和 95% Bootstrap 区间覆盖率；达标模型的主指标为 Brier 分数和校准斜率；女胎分类的主指标为 PR-AUC、灵敏度和 Brier 分数。每个指标都同时报告训练折、验证折和外层测试折，不能只报告最优一次运行。\\n\\n对式(4)--(6)做嵌套模型比较和患者级似然比检验；对离散风险模型做校准曲线、时间分层 Brier 和删失加权检查；对女胎模型做患者级混淆矩阵、ROC/PR、校准和决策曲线。所有区间用患者为重采样单位的 500 次 Bootstrap 计算，随机种子由 `MASTER_SEED=20250912` 派生。\\n\\n### 9.2 灵敏度方案\\n\\n固定逐项改变下列参数，其余设置不变：\\n\\n| 参数 | 主值 | 扰动值 | 观察量 | 判定 |\\n|---|---:|---:|---|---|\\n| Y 达标阈值 | 0.040 | 0.035, 0.045 | BMI 边界、推荐周、达标率 | 主方案排名是否稳定 |\\n| 可靠度目标 | 0.90 | 0.80, 0. ... [truncated 9435 characters] ... 1$ 基准，再输出边界、组数、时点和目标分解。\\n- [ ] 问题三至少比较无误差、估计误差和 1.5 倍误差三个场景，并输出 Pareto 非支配集。\\n- [ ] 女胎模型只用 AB 主标签训练，AE 仅在模型冻结后做外部一致性检查；阈值不在测试集调节。\\n- [ ] 所有概率、权重、归一化目标和性能指标均在 $[0,1]$，技术误差方差非负。\\n- [ ] `constraint_audit.py` 对最终 `results.json` 执行 C1--C14，输出 `audit_pass=True`；失败则跳转 A6。\\n- [ ] Bootstrap 和多初始化结果达到预设稳定性阈值，并记录 seed、版本和收敛指标。\\n- [ ] 图表 JSON 的 `seed` 与结果一致、输入哈希一致、生成时间晚于结果文件。\\n- [ ] 最终所有输出量均在结果约束范围内，才允许进入论文。\\n\\n本题涉及题型：[统计/回归，生存分析，分类评价，优化决策，鲁棒性分析，数据质量控制]，已对照防错手册审查。\\n\\n<!-- MODELING_OK validation=strict subproblems=4 constraints=C1-C14 seed=20250912 -->\\n<!-- FIGURE_MANIFEST_SYNC source=PROBLEM_ANALYSIS.md figures=17 drawio=7 tikz=2 gptimg=0 -->\\n\", \"ok\": true}"
