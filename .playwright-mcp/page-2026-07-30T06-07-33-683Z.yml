                - generic [ref=e2207]: comp-modeling
                - generic [ref=e2208]: "[tool] replace {\"new_text\": \"状态定义为 $DP(g,r,\\\\tau_{prev})$：前 $r$ 名按 BMI 排序的患者被划分为 $g$ 个连续组，上一组推荐时点为 $\\\\tau_{prev}$，状态值为已归一化目标成本的最小值。因为新增一组只会切下一个连续 BMI 片段，片段统计量与此前切分无关，满足最优子结构；上一组时点只为检查式(16)的相邻时点约束而保留。对每个状态保存前驱位置和时点，回溯后再用原始患者记录逐条审计。\\n\\n解析下界取“去掉最小组样本量、时点顺序和组数复杂度约束，但保留 $p_g(\\\\tau_g)\\\\ge p_0$、窗口约束”的松弛问题最优值；可行上界取单组 $G=1$ 的解析可行基准。因候选 BMI 断点和推荐时点均为有限集合，动态规划在该离散可行域上给出精确最优，预期相对松弛下界的目标差距为 0--20%，且相对单组可行上界不增。若小规模候选集用全枚举所得最优值与 DP 不一致，停止输出并回查状态转移。\\n\\n伪代码如下：\", \"old_text\": \"伪代码如下：\", \"path\": \"MODELING_REPORT.md\", \"replace_all\": false}"
