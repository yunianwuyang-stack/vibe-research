                - generic [ref=e1852]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 200, \"end_line\": 245, \"total_lines\": 724, \"content\": \"\\n1. 患者级固定 20% 测试集，余下训练集做 5 折 GroupKFold。\\n2. 每折内拟合预处理器、失败模型、线性混合基准和 GAMM。\\n3. 按预定规则选择主模型，在完整训练集重拟合。\\n4. 患者级 Bootstrap 500 次，每次整簇抽取孕妇，重估平滑曲线、导数和显著性。\\n5. 在冻结测试集上一次性报告 RMSE、MAE、$R^2$、分层误差和覆盖率。\\n\\n## 6. 问题二：仅以 BMI 为核心的分组与最佳时点\\n\\n### 6.1 首达标事件构造\\n\\n对每名男胎孕妇按孕周排序。若相邻观测 $t_{i,j-1}$ 未达标、$t_{ij}$ 达标，则真实首次达标时间位于区间 $(t_{i,j-1},t_{ij}]$；首次观测即达标者左删失于该孕周；25 周仍无达标者右删失。为避免单次反向波动破坏“首次事件”定义，主模型直接建离散首次风险，而非将后续未达标记录改写为第二次事件。\\n\\n对每名孕妇按孕周排序，并以该孕妇实际相邻观测时刻构造事件驱动区间，不用固定网格替代观测到的阈值穿越。设去重后的观测时刻为 $\\\\xi_1<\\\\cdots<\\\\xi_K$，风险区间为 $I_k=(\\\\xi_{k-1},\\\\xi_k]$；若首次检测已达标，则左删失于 $\\\\xi_1$；若在 $\\\\xi_{k-1}$ 未达标而在 $\\\\xi_k$ 达标，则首达标时间区间删失于 $I_k$；25 周内始终未达标者右删失。离散风险率定义为\\n\\n$$\\nh_i(k)=\\\\Pr(T_i\\\\in I_k\\\\mid T_i>\\\\xi_{k-1},b_i)\\n=\\\\operatorname{logit}^{-1}\\\\{\\\\alpha_k+s_b(b_i)\\\\}. \\\\tag{9}\\n$$\\n\\n累计达标概率由条件概率乘法得到\\n\\n$$\\nF_i(t)=\\\\Pr(T_i\\\\le t)=1-\\\\prod_{k:\\\\xi_k\\\\le t}\\\\bigl[1-h_i(k)\\\\bigr]. \\\\tag{10}\\n$$\\n\\n统一记 $S_i(t)=1-F_i(t)$，则删失似然可写为\\n\\n$$\\n\\\\mathcal L_i=\\n\\\\begin{cases}\\nF_i(\\\\xi_1), & \\\\mathrm{left\\\\ censoring},\\\\\\\\\\nF_i(\\\\xi_k)-F_i(\\\\xi_{k-1}), & \\\\mathrm{interval\\\\ censoring}\\\\ I_k,\\\\\\\\\\nS_i(c_i), & \\\\mathrm{right\\\\ censoring\\\\ at}\\\\ c_i.\\n\\\\end{cases} \\\\tag{11}\\n$$\\n\\n这样未达标者不会被伪造事件。BMI 组 $G_g=[c_{g-1},c_g)$ 的标准化累计达标概率为\\n\\n$$\\np_g(t)=\\\\frac{1}{n_g}\\\\sum_{i:b_i\\\\in G_g}F_i(t). \\\\tag{12}\\n$$\\n\\n### 6.2 时点风险与优化模型\\n\\n在可检测窗内定义归一化延迟损失\\n\", \"ok\": true}"
