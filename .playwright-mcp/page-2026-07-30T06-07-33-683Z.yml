                - generic [ref=e980]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 401, \"end_line\": 726, \"total_lines\": 726, \"content\": \"\\\\begin{aligned}\\n&1\\\\le G\\\\le5,\\\\quad c_0<\\\\cdots<c_G,\\\\quad n_g\\\\ge n_{\\\\min},\\\\quad10\\\\le\\\\tau_g\\\\le25,\\\\\\\\\\n&p_g^{(s)}(\\\\tau_g)\\\\ge p_0-0.05\\\\quad \\\\forall g,s,\\\\\\\\\\n&\\\\Pr_{boot}\\\\{p_g(\\\\tau_g)\\\\ge p_0\\\\}\\\\ge0.80,\\\\\\\\\\n&\\\\tau_{g+1}\\\\ge\\\\tau_g-0.5.\\n\\\\end{aligned} \\\\tag{25}\\n$$\\n\\n式(25)同时控制最坏场景和 Bootstrap 可靠性。目标均先按所有候选方案的 5%--95% 分位截断后极差归一化；若极差为 0，该目标判为常数并从权重中移除，剩余权重重新归一化，防止除零或伪多目标。每个候选方案必须保存 $f_1,f_2,f_3,G$ 四个分量及其加权贡献 $w_r\\\\widetilde f_r/J_R$。预期漏达标贡献约占 35%--70%、延迟贡献约占 15%--40%、不确定性与复杂度合计约占 5%--30%；任一分量超过 90% 或低于 1% 时，先检查归一化和权重实现，不能直接接受该解。\\n\\n同时报告三目标 Pareto 前沿。方案 $a$ 支配 $b$ 当且仅当所有目标不劣且至少一个严格更优。主方案从非支配集中选式(24)最小者。若前沿上各目标标准差均小于其均值的 1%，判定 Pareto 退化，唯一处理是删除常数/高度相关目标后重算，禁止把一个点伪称为权衡前沿。\\n\\n### 7.4 求解与验证\\n\\n沿用问题二的动态规划，但片段成本改为式(24)的最坏场景成本。由于组成本仍只依赖连续 BMI 片段、候选时点和上一组时点，最优子结构保持成立。算法步骤：\\n\\n1. 外层按患者做 5 折 GroupKFold；每折内拟合预处理、失败模型和式(19)。\\n2. 用训练折患者的协变量经验分布计算式(21)，不得用验证折分布调边界。\\n3. 患者级 Bootstrap 500 次，场景种子由 `MASTER_SEED + fold*1000 + replicate` 确定。\\n4. 预计算每个 BMI 片段在三个场景下的成本和可行时点，动态规划求 $G=1,\\\\ldots,5$。\\n5. 在验证折只应用已冻结边界与时点，计算组内达标率、Brier、校准斜率和综合损失。\\n6. 以问题二为嵌套基准；问题三可行域和目标定义更保守，不能要求训练目标必然更低，但期望验证校准和最坏场景漏达标率改善。\\n\\n问题三的结构性下界为三个误差场景中分别放松组数、最小组样本量和 Bootstrap 可靠性约束所得的场景最优下界；上界取问题二冻结分组在三场景下重新评价的最大成本。动态规划输出必须同时给出下界 ... [truncated 12992 characters] ... $ 基准，再输出边界、组数、时点和目标分解。\\n- [ ] 问题三至少比较无误差、估计误差和 1.5 倍误差三个场景，并输出 Pareto 非支配集。\\n- [ ] 女胎模型只用 AB 主标签训练，AE 仅在模型冻结后做外部一致性检查；阈值不在测试集调节。\\n- [ ] 所有概率、权重、归一化目标和性能指标均在 $[0,1]$，技术误差方差非负。\\n- [ ] `constraint_audit.py` 对最终 `results.json` 执行 C1--C14，输出 `audit_pass=True`；失败则跳转 A6。\\n- [ ] Bootstrap 和多初始化结果达到预设稳定性阈值，并记录 seed、版本和收敛指标。\\n- [ ] 图表 JSON 的 `seed` 与结果一致、输入哈希一致、生成时间晚于结果文件。\\n- [ ] 最终所有输出量均在结果约束范围内，才允许进入论文。\\n\\n本题涉及题型：[统计/回归，生存分析，分类评价，优化决策，鲁棒性分析，数据质量控制]，已对照防错手册审查。\\n\\n<!-- MODELING_OK validation=strict subproblems=4 constraints=C1-C14 seed=20250912 -->\\n<!-- FIGURE_MANIFEST_SYNC source=PROBLEM_ANALYSIS.md figures=17 drawio=7 tikz=2 gptimg=0 -->\\n\", \"ok\": true}"
