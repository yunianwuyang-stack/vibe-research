              - listitem [ref=e2905]:
                - time [ref=e2906]: 2026/7/30 05:14:29
                - generic [ref=e2907]: comp-modeling
                - generic [ref=e2908]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 380, \"end_line\": 503, \"total_lines\": 503, \"content\": \"J_R=\\\\max_{s\\\\in\\\\{0,1,2\\\\}}\\n\\\\left\\\\{0.55\\\\widetilde f_1^{(s)}+0.25\\\\widetilde f_2+0.15\\\\widetilde f_3^{(s)}\\\\right\\\\}\\n+0.05\\\\widetilde G, \\\\tag{24}\\n$$\\n\\n并满足\\n\\n$$\\n\\\\begin{aligned}\\n&1\\\\le G\\\\le5,\\\\quad c_0<\\\\cdots<c_G,\\\\quad n_g\\\\ge n_{\\\\min},\\\\quad10\\\\le\\\\tau_g\\\\le25,\\\\\\\\\\n&p_g^{(s)}(\\\\tau_g)\\\\ge p_0-0.05\\\\quad \\\\forall g,s,\\\\\\\\\\n&\\\\Pr_{boot}\\\\{p_g(\\\\tau_g)\\\\ge p_0\\\\}\\\\ge0.80,\\\\\\\\\\n&\\\\tau_{g+1}\\\\ge\\\\tau_g-0.5.\\n\\\\end{aligned} \\\\tag{25}\\n$$\\n\\n式(25)同时控制最坏场景和 Bootstrap 可靠性。目标均先按所有候选方案的 5%--95% 分位截断后极差归一化；若极差为 0，该目标判为常数并从权重中移除，剩余权重重新归一化，防止除零或伪多目标。\\n\\n同时报告三目标 Pareto 前沿。方案 $a$ 支配 $b$ 当且仅当所有目标不劣且至少一个严格更优。主方案从非支配集中选式(24)最小者。若前沿上各目标标准差均小于其均值的 1%，判定 Pareto 退化，唯一处理是删除常数/高度相关目标后重算，禁止把一个点伪称为权衡前沿。\\n\\n### 7.4 求解与验证\\n\\n沿用问题二的动态规划，但片段成本改为式(24)的最坏场景成本。由于组成本仍只依赖连续 BMI 片段、候选时点和上一组时点，最优子结构保持成立。算法步骤：\\n\\n1. 外层按患者做 5 折 GroupKFold；每折内拟合预处理、失败模型和式(19)。\\n2. 用训练折患者的协变量经验分布计算式(21)，不得用验证折分布调边界。\\n3. 患者级 Bootstrap 500 次，场景种子由 `MASTER_SEED + fold*1000 + replicate` 确定。\\n4. 预计算每个 BMI 片段在三个场景下的成本和可行时点，动态规划求 $G=1,\\\\ldots,5$。\\n5. 在验证折只应用已冻结边界与时点，计算组内达标率、Brier、校准斜率和综合损失。\\n6. 以问题二为嵌套基准；问题三可行域和目标定义更保守，不能要求训练目标必然更低，但期望验证校准和最坏场景漏达标率改善。\\n\\n模型对照包括不含随机效应的弹性网 Logistic 和校准梯度提升。主指标按顺序固定为 Brier 分数、校准截距/斜率、最坏组漏达标率；AUC 只作区分度辅助。若候选模型 ... [truncated 2164 characters] ... 3$ 规则作为临床可解释基线，不作为默认真值。分别对 T13、T18、T21 采用 one-vs-rest 弹性网；若某类型阳性患者少于 10，仅报告基线规则和二分类模型风险，不拟合不稳定的亚型分类器。\\n\\n### 8.4 评价与外部一致性\\n\\n外层使用重复 5 折 StratifiedGroupKFold，共 5 次重复，固定种子。主指标为 PR-AUC、灵敏度和 Brier；辅助报告 ROC-AUC、特异度、PPV、NPV、F1、校准截距/斜率和 95% 患者 Bootstrap 区间。混淆矩阵按患者聚合且将“需重采”单列。\\n\\n决策曲线净收益为\\n\\n$$\\nNB(\\\\theta)=\\\\frac{TP(\\\\theta)}{N}-\\\\frac{FP(\\\\theta)}{N}\\\\frac{\\\\theta}{1-\\\\theta}, \\\\tag{33}\\n$$\\n\\n只在训练时预定的临床阈值区间 $[0.05,0.50]$ 内与“全部干预、均不干预”比较。AE 在所有模型、校准器和阈值冻结后才做一致性检查，报告 AB 风险与 AE 的列联表和关联区间；AE 不能反向修改模型。\\n\\n鲁棒性分析依次固定为：GC 警戒开/关；完整案例、训练折中位数填补和 IPCW；成本比 2、5、10；患者概率聚合用最大值、首次值、最近值；Z 值缩尾开/关。若结论方向在超过 20% 的预设情景中翻转，则只报告概率和区间，不给单一硬阈值结论。\\n\\n<!-- APPEND -->\", \"ok\": true}"
