                - generic [ref=e2080]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 600, \"end_line\": 660, \"total_lines\": 725, \"content\": \"| 风险损失 $L,J$ | $[0,1]$（归一化后） | 早期较低，延迟时上升 | 分段函数或归一化错误 |\\n| 女胎预测概率 $\\\\widehat\\\\pi$ | $[0,1]$ | 校准后随异常 Z 证据增强而上升 | 链接函数/标签泄漏错误 |\\n| 召回率、特异度、PR-AUC、Brier | $[0,1]$ | 召回率优先，不能以准确率掩盖少数类漏诊 | 指标计算口径错误 |\\n| ICC、技术误差方差 | $[0,1]$、非负 | 重复测量相似度应高于独立记录相似度 | 聚类键或方差分解错误 |\\n\\n预期瞬态行为是早孕周达标概率较低、随孕周增加逐步提升；高 BMI 组的达标曲线通常右移，但允许数据导致局部不单调，最终以带惩罚的累计风险模型保证 $F_i(t)$ 单调。问题三相对问题二的新增协变量应主要改变校准、区间宽度或组界稳定性，而不应被实现为与问题二完全相同的模型；若完全相同，必须检查新增特征是否真的进入式(19)。\\n\\n## 12. 异常处理预案\\n\\n**预案 A1：GAMM 与线性混合模型边际效应差异超过 5%。**\\n- 原因判断：非线性或交互项在边界处不稳定。\\n- 唯一修正方法：降低平滑基维至 `k=4`，重新做患者级五折验证，并以外层 RMSE、残差诊断和边际效应一致性共同选择模型。\\n- 禁止：凭图形主观挑选曲线、删掉边界数据或直接报告较好的一次运行。\\n\\n**预案 A2：某 BMI 分组在 25 周不能满足 $p_0$。**\\n- 原因判断：该组在观测窗口内可靠达标不可达，不能伪造达标时间。\\n- 唯一修正方法：将该候选分组标为不可行，并在预设的 $p_0=0.80$ 敏感性情景中重新运行动态规划；若仍不可行，输出“窗口内不可达”。\\n- 禁止：把 25 周自动写成可靠时点、删除未达标孕妇或把删失者当达标。\\n\\n**预案 A3：训练折中某类女胎异常样本少于 10 名。**\\n- 原因判断：亚型模型参数不可稳定估计。\\n- 唯一修正方法：只保留 AB 二分类弹性网模型和固定 $|Z|\\\\ge3$ 基线，亚型只做描述，不拟合亚型专用分类器。\\n- 禁止：SMOTE 合成患者、在测试集调阈值或报告不稳定亚型系数。\\n\\n**预案 A4：患者级切分存在交集或未来字段进入特征。**\\n- 原因判断：切分或特征工程顺序错误，评价已失效。\\n- 唯一修正方法：回到原始记录，先按孕妇代码重切分，再仅在训练折拟合全部预处理器并重新训练。\\n- 禁止：保留泄漏结果、只删除明显重复行或用测试集重新校准。\\n\\n**预案 A5：Bootstrap、误差场景或重复运行结果不稳定。**\\n- 原因判断：患者异质性高、技术重复不足或随机数管理不完整。\\n- 唯一修正方法：检查种子和患者聚类键，增加至 1000 次患者级 Bootstrap，并报告区间而非单点结果 ... [truncated 614 characters] ... 得用平均首达标周替代生存模型 |\\n| 6 | 有限候选集动态规划 | BMI 排序、候选边界、时点网格 | 最优分组和时点 | 不得用贪心后宣称全局最优 |\\n| 7 | 患者级 Bootstrap 500 次 + 三误差场景 | 记录与技术重复 | 区间、最坏场景目标 | 不得把记录级重采样当独立 |\\n| 8 | 代价敏感弹性网 Logistic + Platt 校准 | 女胎 AB、Z、质量和人口学特征 | 概率、阈值、混淆矩阵 | 不得先 SMOTE 或用 AE 训练 |\\n| 9 | `|Z|>=3` 仅作临床基线 | 女胎 Z 值 | 基线对照 | 不得把固定规则当训练真值 |\\n| 10 | 独立 `constraint_audit.py` 按 C1--C14 复核 | 最终 `results.json` | `audit_pass` 和失败项 | 不得继承优化器中间标记 |\\n\\n问题二的动态规划是有限候选集上的精确枚举；问题三保留相同分层结构，先枚举 BMI 片段和时点，再计算三场景最坏成本，避免高维黑箱优化。模型的非凸部分只来自平滑和随机效应估计，拟合失败时按照 A1 固定基维并重新初始化至少 5 次，记录每次收敛状态、目标值、梯度/残差和最大相对差；不以 `success=True` 单独判定收敛。\\n\\n## 14. 结构性验证输入（供编码阶段使用）\\n\\n### 14.1 约束活跃性预期\\n\\n| 约束 | 预期状态 | 理由 |\\n\", \"ok\": true}"
