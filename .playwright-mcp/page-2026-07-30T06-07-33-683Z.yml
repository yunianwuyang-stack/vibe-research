                - generic [ref=e432]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 1, \"end_line\": 500, \"total_lines\": 726, \"content\": \"# NIPT 检测时点选择与胎儿异常判定建模报告\\n\\n## 1. 任务、数据层级与总体路线\\n\\n本报告完整覆盖四个子问题，建立“质量控制 - 重复测量统计模型 - 风险决策 - 患者级验证”的统一框架。附件含男胎 1082 条、女胎 605 条检测记录；同一孕妇可多次采血，同次采血也可重复测序，因此记录不独立。所有拟合、数据切分、Bootstrap 与评价均以孕妇代码 $i$ 为聚类单元，以第 $j$ 条检测为观测单元。\\n\\n题面硬机制为：可检测窗口 $10\\\\le t_{ij}\\\\le25$ 周；男胎 Y 浓度达标阈值为 $0.04$；问题四以 AB 中的 T13/T18/T21 为目标。统一定义\\n\\n$$\\nD_{ij}=I(y_{ij}\\\\ge0.04),\\\\qquad A_{ij}=I(AB_{ij}\\\\ne\\\\varnothing). \\\\tag{1}\\n$$\\n\\n题面给出的 28 周以后“极高风险”处于本题检测窗口之外，只作极端审计，优化器不得选择 25 周后的时点。数据流为：解析两个 Sheet，统一孕周和比例单位，建立质控及失败标记，按性别分流，拟合男胎浓度与达标模型，联合求 BMI 分组和时点，再独立建立女胎异常判定模型。\\n\\n### 1.1 赛题分析升级建议的逐条审视\\n\\n| 初步模型到最终模型 | 触发原因 | 不升级的影响 | 决策与保留机制 |\\n|---|---|---|---|\\n| 普通回归到混合效应/聚类稳健模型 | 多次采血、同次重复检测 | 标准误偏小，显著性虚高 | 完整采用；患者随机截距、技术重复方差、患者级 Bootstrap |\\n| 普通分箱到风险加权分组-时点优化 | 最佳时点需兼顾未达标和延迟风险 | 分组边界主观，平均首达标周不能保证可靠性 | 完整采用；概率约束、分段时点损失、边界与时点联合优化 |\\n| 普通分类到代价敏感校准分类 | 异常稀少且漏诊代价更高 | 准确率虚高，输出概率不可用 | 完整采用；类别权重、交叉拟合校准、PR-AUC 和代价阈值 |\\n| 完整观测回归到右删失/失败机制 | 25 周未达标、测序失败 | 把未观察事件伪造为达标，时点系统提前 | 完整采用；右删失似然、失败模型及 IPCW 敏感性 |\\n\\n没有否决任何升级。题目未给临床风险货币成本，不构成跳过风险机制的理由：各损失先归一化到 $[0,1]$，主情景固定“漏达标损失高于延迟损失”，并给低、中、高三组权重。未给统一失败阈值时，以题面 GC 正常范围和训练折质量分位数构造可切换警戒标记，同时保留不删、完整案例与 IPCW 三种分析。\\n\\n### 1.2 方法调研、候选比较与选择\\n\\n| 子问题 | 候选方法 | 主方法 | 选择依据 |\\n|---|---|---|---|\\n| 问题一 | OLS、线性混合模型、GAM ... [truncated 16114 characters] ... 内层训练得到 out-of-fold 原始概率，再拟合 Platt 校准\\n\\n$$\\n\\\\pi^{cal}=\\\\operatorname{logit}^{-1}\\\\{a+b\\\\operatorname{logit}(\\\\widehat\\\\pi)\\\\}. \\\\tag{29}\\n$$\\n\\n当校准样本中阳性少于 20 时，唯一替代为 Platt，不使用更灵活的 isotonic；阳性不少于 20 时仍以 Platt 为主，isotonic 只作敏感性。最终阈值从训练折候选概率中选择，使\\n\\n$$\\n\\\\theta^*=\\\\arg\\\\min_{\\\\theta\\\\in[0,1]}\\n\\\\left[C_{FN}\\\\widehat{FN}(\\\\theta)+C_{FP}\\\\widehat{FP}(\\\\theta)\\\\right],\\n\\\\qquad C_{FN}/C_{FP}=5, \\\\tag{30}\\n$$\\n\\n并加灵敏度约束\\n\\n$$\\n\\\\widehat{\\\\operatorname{Sensitivity}}(\\\\theta)\\\\ge0.90. \\\\tag{31}\\n$$\\n\\n若训练折任何阈值均无法达到式(31)，唯一处理是选择灵敏度最大的阈值，并报告“90% 灵敏度目标不可达”，禁止在测试集调阈值。最终规则为\\n\\n$$\\n\\\\widehat A_{ij}=I(\\\\pi_{ij}^{cal}\\\\ge\\\\theta^*). \\\\tag{32}\\n$$\\n\", \"ok\": true}"
