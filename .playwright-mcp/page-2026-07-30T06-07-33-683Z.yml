                - generic [ref=e4208]: "[tool result] read: {\"path\": \"_utils/error_prevention.md\", \"start_line\": 1364, \"end_line\": 1492, \"total_lines\": 2313, \"content\": \"## 13.1 三类典型陷阱\\n\\n### 陷阱 A：盲信 status 字段，不查残差\\n- scipy `minimize` 返回 `success=True`，但 `fun` 接近 1e6，`jac` 范数也大（未真正收敛）。\\n- 启发式（GA/SA/PSO）跑完 max_iter 就返回，但目标函数还在下降。\\n- MCMC 跑了 N 步就停，但 Gelman-Rubin R̂ > 1.1（链未混合）。\\n\\n### 陷阱 B：过早终止 / 容差太松\\n- `tol=1e-3` 对相对误差 1% 的题来说太松。\\n- 默认 `max_iter=100` 对非凸大规模问题不够。\\n- 早停（early stopping）触发条件设错（patience 太小）。\\n\\n### 陷阱 C：初始点 / 重启次数不足\\n- 单一初始点跑出局部极小，未做 multistart。\\n- 启发式只跑 1 次，未对比多次种子的最好/平均/方差。\\n- 蒙特卡洛积分样本数不够，方差未收敛。\\n\\n## 13.2 五条强制复核\\n\\n| # | 规则 | 落地形式 |\\n|---|---|---|\\n| 1 | **必查 KKT / 一阶条件**（连续优化） | `assert np.linalg.norm(grad) < tol` 或 dual 残差 < tol |\\n| 2 | **必跑 multistart（≥ 5 个初始点）** | 取最优的同时记录 `(mean, std, min, max)` 落到 results.json |\\n| 3 | **启发式必须报告收敛曲线** | `figures/convergence_history.json` 含每代/每代 best/avg/std |\\n| 4 | **容差与题目精度匹配** | 题面要 4 位小数 → `tol ≤ 1e-5`；不要用默认值兜底 |\\n| 5 | **status='converged' 必须有\\\"二阶证据\\\"** | 残差 / 梯度范数 / 互补松弛 / 链混合度，缺一不可 |\\n\\n## 13.3 通用求解器收敛性审计模板\\n\\n```python\\n# solver_audit.py — 求解器收敛性审计\\nimport numpy as np\\nimport json, sys\\nfrom pathlib import Path\\n\\ndef audit_continuous_optimum(result, tol_grad=1e-4, tol_eq=1e-6) -> dict:\\n \\\"\\\"\\\"\\n 审计 scipy.optimize / cvxpy / similar 结果。\\n result 至少含: success, fun, x, (option ... [truncated 3194 characters] ... = audit_continuous_optimum(r['solver_result'])\\n print(f\\\"连续优化审计: {'✅' if a['audit_pass'] else '❌'}\\\")\\n for f in a['fails']: print(f\\\" {f}\\\")\\n if 'multistart_results' in r:\\n a = audit_multistart(r['multistart_results'])\\n print(f\\\"multistart 审计: {'✅' if a['audit_pass'] else '❌'} rel_spread={a.get('rel_spread')}\\\")\\n for f in a['fails']: print(f\\\" {f}\\\")\\n if 'convergence_history' in r:\\n a = audit_heuristic_convergence(r['convergence_history'])\\n print(f\\\"启发式收敛审计: {'✅' if a['audit_pass'] else '❌'}\\\")\\n for f in a['fails']: print(f\\\" {f}\\\")\\n```\\n\\n## 13.4 真实案例\\n\", \"ok\": true}"
