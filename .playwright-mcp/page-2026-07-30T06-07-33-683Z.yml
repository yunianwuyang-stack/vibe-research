                - generic [ref=e4404]: "[tool result] read: {\"path\": \"PROBLEM_ANALYSIS.md\", \"start_line\": 1, \"end_line\": 120, \"total_lines\": 370, \"content\": \"# 2025 年高教社杯全国大学生数学建模竞赛 C 题分析报告\\n\\n## 一、赛题概述\\n\\n**本赛题共 4 个子问题。** 题目研究无创产前检测（NIPT）的检测时点选择与胎儿异常判定。附件按胎儿性别分为两组：男胎数据含 Y 染色体 Z 值和 Y 染色体浓度，女胎数据的 Y 字段为空；两组均包含孕妇基本信息、孕周、测序质量、13/18/21 号染色体 Z 值、X 染色体信息、非整倍体标签及出生后健康结果。\\n\\n题面给出的临床规则是：可检测孕周约为 10--25 周；男胎 Y 染色体浓度达到或超过 $4\\\\%$ 时，NIPT 结果基本准确；早期（12 周以内）发现异常风险较低，中期（13--27 周）风险高，晚期（28 周以后）风险极高。男胎的达标时间与孕周、BMI 以及身高、体重、年龄等因素相关。实际数据存在测序失败、多次采血和一次采血多次检测，因此不能把所有行简单视为相互独立的个体样本。\\n\\n核心决策链为：\\n\\n$$\\n\\\\text{质量控制} \\\\rightarrow \\\\text{男/女胎分层} \\\\rightarrow \\\\text{Y浓度建模或异常分类} \\\\rightarrow \\\\text{时点/判定规则} \\\\rightarrow \\\\text{误差与稳健性评估}.\\n$$\\n\\n## 二、四个子问题拆解\\n\\n| 子问题 | 输入 | 输出 | 难度 | 建议方法 | 关系 |\\n|---|---|---|---|---|---|\\n| 问题1 | 男胎孕周、BMI、Y 浓度、年龄、身高、体重及质量指标 | Y 浓度与孕周/BMI 等的关系模型、显著性检验 | 中等 | 相关分析 + GAM/混合效应回归 + 稳健性检验 | 基础分析，供问题2/3 使用 |\\n| 问题2 | 男胎 BMI、孕周与 Y 浓度达标记录 | BMI 分组、组内最佳检测时点、检测误差影响 | 困难 | 首达标时间/达标概率模型 + 动态规划或约束优化 | 依赖问题1，突出 BMI |\\n| 问题3 | 男胎全部协变量、达标比例和测量误差 | 多因素 BMI 分组及最佳时点、误差敏感性 | 困难 | 生存/离散时间模型 + 混合效应/Bootstrap + 多目标优化 | 在问题2上升级，避免重复使用问题2结论 |\\n| 问题4 | 女胎 13/18/21 号非整倍体标签、X/Z/GC/读段/BMI | 女胎异常判定方法、阈值和验证结果 | 困难 | 分层逻辑回归/树模型对比 + 代价敏感分类 + 校准 | 与问题1--3相对独立，但共享质控流程 |\\n\\n### 子问题依赖与递进\\n\\n问题1先确定孕周和 BMI 对 Y 浓度的主效应、非线性及个体内相关结构；问题2将连续浓度关系转化为“首次达到 $4\\\\%$”的分组时点决策；问题3加入个人特征、达标比例和测量误差，允许分 ... [truncated 2674 characters] ... 一比对读段数、GC、过滤比例）、染色体指标（13/18/21/X/Y 的 Z 值和浓度）、标签变量（AB、AE）。\\n\\n### 6.2 初步特征和数据质量\\n\\n1. 男胎 Y 浓度在较早孕周可出现低于 $4\\\\%$、负值或临界值，随孕周增加通常逐渐增大；应使用浓度原值建模，并将百分比统一为小数。\\n2. 同一孕妇一般有多次抽血，部分记录在同一孕周具有重复检测；应以 `孕妇代码` 做聚类键，以 `检测抽血次数` 和检测日期排序。\\n3. BMI 分布集中在高 BMI 区域，题目给出的示例区间 `[20,28)、[28,32)、[32,36)、[36,40)、40以上` 可作为初始分箱，但最终边界必须由样本量、风险曲线和交叉验证确定。\\n4. 女胎 X 浓度可为负值，题面已解释为估计量，不应按普通生理比例直接截断；应同时保留 X Z 值、X 浓度并检查二者关系。\\n5. AB 为空表示无异常，`T13`、`T18`、`T21` 及其组合表示异常类别；需要统一编码为二分类 `abnormal`，并保留异常类型多标签。\\n6. 测序质量字段存在明显的重复测量和极端质量记录，不能在建模前仅按均值填补；先定义质控标记，再做完整案例、插补和不剔除三种敏感性分析。\\n7. 末次月经、检测日期在文本中既有 Excel 日期序列也有日期字符串，必须先转为日期并以检测孕周字段作为主时间，同时用日期差进行一致性核查。\\n\\n### 6.3 描述性统计任务（留给后续代码实现）\\n\\n\", \"ok\": true}"
