                - generic [ref=e3428]: "[tool result] read: {\"path\": \"CLAUDE.md\", \"start_line\": 1, \"end_line\": 120, \"total_lines\": 142, \"content\": \"# 研究项目: NIPT 的时点选择与胎儿的异常判定\\n\\n## 项目说明\\n这是一个自动化研究管理的工作流引擎，当前正在执行「国赛数学建模 (CUMCM)」流水线。\\n\\n## 流水线步骤\\n 1. 赛题分析 (comp-prob-analysis)\\n 2. 建模求解 (comp-modeling)\\n 3. 编程实现 (comp-code)\\n 4. 图表生成 (paper-figure)\\n 5. 流程与架构图绘制 (paper-figure-html)\\n 6. 竞赛论文撰写 (comp-paper-zh)\\n 7. 编译与合规检查 (comp-compile-zh)\\n\\n## 重要规则\\n- 所有产出文件都写入当前工作目录（不要写到其他位置）\\n- 使用 Write 工具创建文件，如果文件太长则用 Bash 的 cat << 'EOF' > file 方式\\n- 每个步骤完成后至少产出一个文件\\n- 读取工作区中已有的文件，在前步骤的基础上继续工作\\n- 使用中文撰写正文（除非是 LaTeX 代码）\\n\\n## 工作区已有文件\\n- MODELING_REPORT.md\\n- PROBLEM_ANALYSIS.md\\n- user_data/C题.pdf\\n- user_data/C题.pdf.txt\\n- user_data/附件.xlsx\\n- user_data/附件.xlsx.txt\\n请仔细阅读并利用这些文件作为研究基础。\\n\\n## 用户上传文件分类\\n### 数据集 / 附件数据 (data)\\n- user_data/附件.xlsx\\n### 赛题 (problem)\\n- user_data/C题.pdf\\n必须按上述角色理解材料；已有结果和图表不得被编造内容覆盖。\\n\\n## 参数\\n- 研究主题: NIPT 的时点选择与胎儿的异常判定\\n- template: comp_cumcm\\n- skip_improvement_loop: True\\n- competition: cumcm\\n- language: zh\\n- max_pages: 30\\n- output_format: pdf\\n- flowchart_engine: html\\n- rich_mode: False\\n- tools: python\\n- min_figures: auto\\n- min_tables: auto\\n- min_models: auto\\n- figure_style: default\\n- validation_mode: strict\\n- require_competition_input: True\\n- research_question: NIPT 的时点选择与胎儿的异常判定\\n- inclusion_criteria: 仅接受附件xl ... [truncated 1043 characters] ... 禁止：说'这是题目数据的特性'来回避修正责任\\n- 必须：分析原因 → 修正数据或模型（加物理约束）→ 重新计算 → 用修正后的合理值\\n- 必须：在报告中写明'原始结果为X（不合理），修正后为Y，修正方法为Z'\\n- 必须：修正后重新验证，确认结果在合理范围内\\n- 必须：每个子问题代码末尾有 validate_constraints() 自动验证\\n\\n⛔ 关键认知：数学正确 ≠ 物理合理。ODE数值解超出物理边界时，\\n不是'数据导致的正常结果'，而是模型缺少物理约束（接触约束/饱和/边界条件）。\\n必须在代码中加入约束后重新求解，而不是解释为什么会超出。\\n\\n⛔ 几何/参数完整性：\\n- 建模：禁止未声明的几何简化（矩形→线段、实体→质心点）\\n- 代码：禁止用中间计算量替代物理实体参数（用完整尺寸，不用中心距代替全长）\\n- 碰撞/约束检测必须用实体完整外轮廓，不能只用中心点距离\\n\\n⛔ 遮蔽/覆盖/碰撞判定的完整性（防止对象降维）：\\n- 判定必须作用于目标的完整几何边界（所有边界点或等价的充要条件）\\n- 函数签名必须包含几何参数（半径/高度/长宽/外轮廓），只传一个坐标点 = 反模式\\n- 禁止用'中心被遮蔽 = 整体被遮蔽'的等价假设（除非证明等价性）\\n- 离散采样近似时必须做收敛性验证（如 N=100→300→500 结果稳定才算收敛）\\n- 代码注释必须说明：判定的是哪个几何体的哪些边界（如'圆柱体上下底面圆周 300 点'）\\n\\n\", \"ok\": true}"
