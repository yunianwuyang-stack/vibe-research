                - generic [ref=e2976]: "[tool] replace {\"new_text\": \"## 7. 问题三：多因素、达标比例与检测误差的联合决策\\n\\n### 7.1 相对问题二的模型升级\\n\\n问题二只允许 BMI 进入风险率，问题三新增年龄、身高、体重、孕产次数、IVF、测序质量、失败机制及患者随机效应。组别仍必须以 BMI 区间表达，但组内推荐时点由该组真实协变量分布标准化得到；因此新增特征可以改变组界、时点和不确定性。若外层交叉验证中多因素模型相对问题二的 Brier 分数、校准误差及综合损失均无至少 1% 改善，则不声称新增变量有收益，并保留问题二简约方案。\\n\\n多因素离散风险模型为\\n\\n$$\\n\\\\operatorname{logit}h_i(k)=\\\\alpha_k+s_b(b_i)+s_a(a_i)+\\n\\\\beta_h h_i^{\\\\ast}+\\\\beta_w w_{ik}^{\\\\ast}\\n+\\\\boldsymbol\\\\beta_p^T\\\\boldsymbol p_i+\\n\\\\boldsymbol\\\\eta^T\\\\boldsymbol q_{ik}+u_i, \\\\tag{19}\\n$$\\n\\n其中带星号变量为训练折稳健标准化值，$\\\\boldsymbol p_i$ 含孕次、产次和 IVF，$u_i\\\\sim N(0,\\\\sigma_u^2)$。BMI、身高和体重共线：先算 VIF；若 VIF 大于 10，固定保留题目核心 BMI，将身高和体重替换为“相对首次体重变化”和身高，或对非核心连续变量做训练折 PCA，主模型不得同时解释高度共线系数。\\n\\n对患者 $i$，累计概率仍由式(10)动态派生：\\n\\n$$\\nF_i(t\\\\mid\\\\boldsymbol x_i,\\\\boldsymbol q_i)=\\n1-\\\\prod_{k:r_k\\\\le t}\\\\left[1-h_i(k\\\\mid\\\\boldsymbol x_i,\\\\boldsymbol q_{ik})\\\\right]. \\\\tag{20}\\n$$\\n\\n禁止把质量变量或时变体重取全样本均值后固定；预测某时点时使用该患者截至该时点可获得的当前/最近一次状态。为避免未来信息，若推荐决策发生在首次检测前，只使用首次检测时可得的人口学变量和历史上可观测的基线质量分布，不使用未来抽血质量。\\n\\n### 7.2 达标比例估计与测量误差\\n\\nBMI 组在"
