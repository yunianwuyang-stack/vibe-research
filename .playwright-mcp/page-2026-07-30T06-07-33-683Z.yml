                - generic [ref=e2040]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 520, \"end_line\": 590, \"total_lines\": 725, \"content\": \"\\n所有训练、预处理和阈值选择均在患者代码层面完成。男胎浓度模型的主指标为患者级外层测试 RMSE，辅助指标为 MAE、解释偏差、残差均值和 95% Bootstrap 区间覆盖率；达标模型的主指标为 Brier 分数和校准斜率；女胎分类的主指标为 PR-AUC、灵敏度和 Brier 分数。每个指标都同时报告训练折、验证折和外层测试折，不能只报告最优一次运行。\\n\\n对式(4)--(6)做嵌套模型比较和患者级似然比检验；对离散风险模型做校准曲线、时间分层 Brier 和删失加权检查；对女胎模型做患者级混淆矩阵、ROC/PR、校准和决策曲线。所有区间用患者为重采样单位的 500 次 Bootstrap 计算，随机种子由 `MASTER_SEED=20250912` 派生。\\n\\n### 9.2 灵敏度方案\\n\\n固定逐项改变下列参数，其余设置不变：\\n\\n| 参数 | 主值 | 扰动值 | 观察量 | 判定 |\\n|---|---:|---:|---|---|\\n| Y 达标阈值 | 0.040 | 0.035, 0.045 | BMI 边界、推荐周、达标率 | 主方案排名是否稳定 |\\n| 可靠度目标 | 0.90 | 0.80, 0.85, 0.95 | 可行组数、时点 | 是否出现不可行 |\\n| 风险权重 | (0.50,0.25,0.15,0.10) | 低/中/高风险三情景 | $J$ 与时点 | 组间排序是否改变 |\\n| 技术误差标准差 | $\\\\widehat\\\\sigma_{tech}$ | $0,1.5\\\\widehat\\\\sigma_{tech}$ | 漏达标率、区间宽度 | 最坏场景是否可接受 |\\n| 质控规则 | GC 警戒开启 | 关闭、训练折分位数替代 | 样本数和性能 | 是否发生方向翻转 |\\n| 女胎漏诊/误报成本比 | 5 | 2,10 | 分类阈值和灵敏度 | 阈值可解释性 |\\n\\n若主要推荐组界或时点在预设情景中超过 20% 的运行发生翻转，则只报告候选区间和概率，不给出唯一硬规则。问题二使用 0.5 周网格并用 0.25 周复算；若推荐时点变化大于 0.5 周，报告为网格未收敛，并采用 0.25 周结果。\\n\\n### 9.3 单位、切分和随机性审查\\n\\n孕周统一为周，`w+d` 转换为 $w+d/7$；BMI 为 kg/m$^2$，身高为 cm，体重为 kg，浓度和质量比例统一为 $[0,1]$ 比例而非百分数，读段数为条。式(13)和所有风险目标均无量纲；不同量纲目标先极差归一化再加权。图表轴必须写单位。任何跨问题传递的数值都在字段字典中标明单位。\\n\\n先按孕妇代码切分，再在训练折拟合填补器、标准化器、VIF、PCA、失败模型、分类器和校准器。由于本题是检测记录的纵向数据，外层随机切分不会把同一孕妇拆开；推荐时点的验证只 ... [truncated 2389 characters] ... | 决策权重非负且和为 1 |\\n| C14 | `all(0.0 <= metric <= 1.0 for metric in normalized_objectives)` | 归一化目标处于 $[0,1]$ |\\n\\n其中 `dynamic_F(rec,t)` 必须使用该患者在 $t$ 时点可获得的当前/最近质量状态和人口学变量计算式(20)；禁止用静态参考点、全体均值或单一 BMI 组均值替代。C1--C14 均属于结果落盘后的独立检查，任何一项异常都触发异常预案，而不是在图表中解释为数据特性。\\n\\n## 11. 合理性预验证与结果预期范围\\n\\n### 11.1 解析可行基准\\n\\n在优化前先构造 $G=1$ 的可行基准：取全体男胎患者的训练折 90% 达标分位点 $q_{0.90}$，令\\n\\n$$\\n\\\\tau^{base}=\\\\min\\\\{t\\\\in\\\\{10,10.5,\\\\ldots,25\\\\}:\\\\widehat p_{all}(t)\\\\ge p_0\\\\},\\n$$\\n\\n若不存在，则将该基准标记为“可靠度不可达”，并按预先声明的 $p_0=0.80$ 敏感性方案重新求解。存在可行基准时，动态规划主方案的归一化目标不得劣于该基准；若劣于，优先检查成本归一化和约束审计，不能接受优化器输出。所有 $G>1$ 候选都必须满足每组患者数不少于 `MIN_GROUP_PATIENTS=max(20, ceil(0.05*N_male))`。\\n\\n\", \"ok\": true}"
