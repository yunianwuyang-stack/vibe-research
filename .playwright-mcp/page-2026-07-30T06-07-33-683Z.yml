                - generic [ref=e3400]: "[tool result] search: {\"query\": \"统计|分类|回归|第九章|第十章|第十一章|第十二章|第十三章\", \"matches\": [{\"path\": \"_utils/error_prevention.md\", \"line\": 102, \"text\": \"- 验证方法：随机采样 1000 个点，统计满足所有约束的比例（可行比例）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 138, \"text\": \"- 必须用不同随机种子跑 ≥5 次，统计目标函数值的分布：\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 217, \"text\": \" - **蒙特卡洛模拟**：随机扰动参数 1000 次，统计解的可行率和目标函数分布\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 242, \"text\": \"- [ ] 开环积分类模型必须设计去漂移/反馈机制\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 264, \"text\": \"## 三、统计/回归/预测类\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 269, \"text\": \"- [ ] 多元回归必须检查共线性（VIF>10 的变量需处理）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 272, \"text\": \"- [ ] 异常值处理策略必须说明（剔除/缩尾/稳健回归）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 290, \"text\": \"- 异常值拉偏回归 → 必须做稳健回归或剔除异常值后对比\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 424, \"text\": \"- 面光源：遮挡判定 = 多条射线的统计（采样数 ≥ 100）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 470, \"text\": \"- [ ] 模型评估指标必须与业务目标一致（分类用F1/AUC，回归用RMSE/MAE）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 682, \"text\": \" - 涉及矩阵运算（回归/线性方程组/特征值）时，必须检查条件数：\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 748, \"text\": \"| 异常值处理 | 判定标准（几倍标准差）、处理方式（剔除/缩尾/替换） | 回归系数方向可能反转 |\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 803, \"text\": \"- **后果**：分区 ... [truncated 655 characters] ... rror_prevention.md\", \"line\": 1354, \"text\": \"- **图像分类**：训练集和测试集有重复样本（同一拍摄人不同角度），AUC 假高。规则 1+4 救场。\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 1540, \"text\": \"- 参数 < 10 个的题目（纯回归 / 简单 EDA）：仅规则 1（建议性）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 2147, \"text\": \"# 十五、事件源分类计数与跨步骤口径对账（防变量复用 / 写稿脑补）\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 2159, \"text\": \"### 陷阱 B：聚合统计丢失溯源\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 2184, \"text\": \"- 多种漏检/拦截/通过原因（误报 / 漏报 / 边界）累加同一统计指标\"}, {\"path\": \"_utils/error_prevention.md\", \"line\": 2189, \"text\": \"# event_breakdown_audit.py — 事件源分类反推校验（与具体业务无关）\"}], \"files_scanned\": 1, \"truncated\": false, \"ok\": true}"
