                - generic [ref=e2088]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 430, \"end_line\": 500, \"total_lines\": 725, \"content\": \"\\n### 8.1 标签、特征与质控门\\n\\n主标签为式(1)的 AB 二分类，并保留三个异常类型\\n\\n$$\\nA_i^{(c)}=I(c\\\\in AB_i),\\\\qquad c\\\\in\\\\{T13,T18,T21\\\\}. \\\\tag{26}\\n$$\\n\\n同一孕妇有多条记录时不删除重复：记录级模型通过患者聚类处理，患者级最终概率取截至该次检测可得记录中“校准概率最大值”，体现筛查中任一阳性信号需复核；另以首次记录和最近记录作为敏感性方案。特征严格限定为：\\n\\n- 染色体证据：$z^{13},z^{18},z^{21},z^X$ 和 X 浓度；\\n- 测序质量：式(2)中除 Y 相关字段外的变量；\\n- 个体因素：孕周、BMI、年龄、身高、体重、孕产次数和 IVF；\\n- 禁止特征：Y 字段、AB 派生字段、AE、出生后信息、未来检测结果。\\n\\n质量警戒不覆盖 AB 标签。输出三级判定：质控不通过为“需重采”；质控通过后模型概率达到阈值为“高风险需诊断”；其余为“低风险随访”。“需重采”不计作阴性，避免失败样本稀释漏诊率。\\n\\n### 8.2 可解释主模型\\n\\n连续变量在训练折稳健标准化。代价敏感弹性网 Logistic 为\\n\\n$$\\n\\\\widehat\\\\pi_{ij}=\\\\operatorname{logit}^{-1}\\\\left(\\\\beta_0+\\n\\\\boldsymbol\\\\beta_z^T\\\\boldsymbol z_{ij}+\\n\\\\boldsymbol\\\\beta_q^T\\\\boldsymbol q_{ij}+\\n\\\\boldsymbol\\\\beta_x^T\\\\boldsymbol x_{ij}\\\\right), \\\\tag{27}\\n$$\\n\\n参数通过加权负对数似然估计：\\n\\n$$\\n\\\\min_{\\\\boldsymbol\\\\beta}\\n-\\\\sum_{i,j}\\\\omega_{A_{ij}}\\n\\\\left[A_{ij}\\\\log\\\\widehat\\\\pi_{ij}+(1-A_{ij})\\\\log(1-\\\\widehat\\\\pi_{ij})\\\\right]\\n+\\\\lambda\\\\left[\\\\alpha\\\\lVert\\\\boldsymbol\\\\beta\\\\rVert_1+\\n\\\\frac{1-\\\\alpha}{2}\\\\lVert\\\\boldsymbol\\\\beta\\\\rVert_2^2\\\\right]. \\\\tag{28}\\n$$\\n\\n类别权重按训练折反频率初始化，再由固定成本比约束正类权重不低于负类。内层 5 折 StratifiedGroupKFold 选择 $\\\\alpha\\\\in\\\\{0,0.5,1\\\\}$ 和对数网格上的 $\\\\lambda$，主指标为 PR-AUC，Brier 分数作并列判据。禁止先做 SMOTE；若训练 ... [truncated 135 characters] ... 层训练得到 out-of-fold 原始概率，再拟合 Platt 校准\\n\\n$$\\n\\\\pi^{cal}=\\\\operatorname{logit}^{-1}\\\\{a+b\\\\operatorname{logit}(\\\\widehat\\\\pi)\\\\}. \\\\tag{29}\\n$$\\n\\n当校准样本中阳性少于 20 时，唯一替代为 Platt，不使用更灵活的 isotonic；阳性不少于 20 时仍以 Platt 为主，isotonic 只作敏感性。最终阈值从训练折候选概率中选择，使\\n\\n$$\\n\\\\theta^*=\\\\arg\\\\min_{\\\\theta\\\\in[0,1]}\\n\\\\left[C_{FN}\\\\widehat{FN}(\\\\theta)+C_{FP}\\\\widehat{FP}(\\\\theta)\\\\right],\\n\\\\qquad C_{FN}/C_{FP}=5, \\\\tag{30}\\n$$\\n\\n并加灵敏度约束\\n\\n$$\\n\\\\widehat{\\\\operatorname{Sensitivity}}(\\\\theta)\\\\ge0.90. \\\\tag{31}\\n$$\\n\\n若训练折任何阈值均无法达到式(31)，唯一处理是选择灵敏度最大的阈值，并报告“90% 灵敏度目标不可达”，禁止在测试集调阈值。最终规则为\\n\\n$$\\n\\\\widehat A_{ij}=I(\\\\pi_{ij}^{cal}\\\\ge\\\\theta^*). \\\\tag{32}\\n$$\\n\\n\", \"ok\": true}"
