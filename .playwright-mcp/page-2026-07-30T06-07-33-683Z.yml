                - generic [ref=e1083]: comp-code
                - generic [ref=e1084]: "[tool result] search: {\"query\": \"列\", \"matches\": [{\"path\": \"MODELING_REPORT.md\", \"line\": 35, \"text\": \"方法依据采用可核验的经典体系：Wood（2017）的惩罚样条与广义加性模型用于非线性纵向效应；Tutz 与 Schmid（2016）的离散时间事件史框架用于区间删失/右删失的首达标时间；Steyerberg（2019）的临床预测模型原则用于患者级验证、校准与过拟合控制；Vickers 与 Elkin（2006）的决策曲线用于阈值净收益评价。方法选择按本题样本结构而非算法新颖性决定：记录数约千级、患者内重复、事件时间仅在两次检测之间可定位，因此问题一优先半参数混合模型，问题二/三优先可直接写入删失似然且能输出累计概率的离散时间模型，问题四优先小样本下稳定、可校准且可解释的惩罚 Logistic。完整书目信息在论文参考文献中统一列出。\"}, {\"path\": \"MODELING_REPORT.md\", \"line\": 42, \"text\": \"2. 比例字段整列判断单位：若训练数据中位数大于 1 才整列除以 100，记录转换元信息，禁止逐行猜测。\"}, {\"path\": \"MODELING_REPORT.md\", \"line\": 470, \"text\": \"类别权重按训练折反频率初始化，再由固定成本比约束正类权重不低于负类。内层 5 折 StratifiedGroupKFold 选择 $\\\\alpha\\\\in\\\\{0,0.5,1\\\\}$ 和对数网格上的 $\\\\lambda$，主指标为 PR-AUC，Brier 分数作并列判据。禁止先做 SMOTE；若训练折异常数过少，使用类别权重和惩罚回归，不合成患者。\"}, {\"path\": \"MODELING_REPORT.md\", \"line\": 506, \"text\": \"外层使用重复 5 折 StratifiedGroupKFold，共 5 次重复，固定种子。主指标为 PR-AUC、灵敏度和 Brier；辅助报告 ROC-AUC、特异度、PPV、NPV、F1、校准截距/斜率和 95% 患者 Bootstrap 区间。混淆矩阵按患者聚合且将“需重采”单列。\"}, {\"path\": \"MODELING_REPORT.md\", \"line\": 514, \"text\": \"只在训练时预定的临床阈值区间 $[0.05,0.50]$ 内与“全部干预、均不干预”比较。AE 在所有模型、校准器和阈值冻结后才做一致性检查，报告 AB 风险与 AE 的列联表和关联区间；AE 不能反向修改模型。\"}, {\"path\": \"MODELING_REPORT.md\", \"line\": 528, \"text\": \"固定逐项改变下列参数，其余设置不变：\"}, {\"path\": \"MODELING_REPORT.md\", \"line\": 559, \"text\": \"下列表达式是 `constraint_audit.py` 对最终 `results.json` 重新计算的接口；不得直接继承求解器的 `feasible` 标记。对任一不满足的约束，结果不得进入论文表格。\"}], \"files_scanned\": 1, \"truncated\": false, \"ok\": true}"
