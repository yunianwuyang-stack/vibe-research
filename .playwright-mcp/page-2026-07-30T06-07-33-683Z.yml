                - generic [ref=e2048]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 220, \"end_line\": 330, \"total_lines\": 725, \"content\": \"累计达标概率由条件概率乘法得到\\n\\n$$\\nF_i(t)=\\\\Pr(T_i\\\\le t)=1-\\\\prod_{k:\\\\xi_k\\\\le t}\\\\bigl[1-h_i(k)\\\\bigr]. \\\\tag{10}\\n$$\\n\\n统一记 $S_i(t)=1-F_i(t)$，则删失似然可写为\\n\\n$$\\n\\\\mathcal L_i=\\n\\\\begin{cases}\\nF_i(\\\\xi_1), & \\\\mathrm{left\\\\ censoring},\\\\\\\\\\nF_i(\\\\xi_k)-F_i(\\\\xi_{k-1}), & \\\\mathrm{interval\\\\ censoring}\\\\ I_k,\\\\\\\\\\nh_i(k)\\\\prod_{r<k}[1-h_i(r)], & \\\\mathrm{event\\\\ in}\\\\ I_k,\\\\\\\\\\nS_i(c_i), & \\\\mathrm{right\\\\ censoring\\\\ at}\\\\ c_i.\\n\\\\end{cases} \\\\tag{11}\\n$$\\n\\n这样未达标者不会被伪造事件。BMI 组 $G_g=[c_{g-1},c_g)$ 的标准化累计达标概率为\\n\\n$$\\np_g(t)=\\\\frac{1}{n_g}\\\\sum_{i:b_i\\\\in G_g}F_i(t). \\\\tag{12}\\n$$\\n\\n### 6.2 时点风险与优化模型\\n\\n在可检测窗内定义归一化延迟损失\\n\\n$$\\nL(t)=\\n\\\\begin{cases}\\n(t-10)/5, & 10\\\\le t\\\\le12,\\\\\\\\\\n0.4+0.6(t-12)/13, & 12<t\\\\le25.\\n\\\\end{cases} \\\\tag{13}\\n$$\\n\\n它只表达题面“越晚风险越高”的相对等级，不解释为真实临床发生率。每组概率方差由患者 Bootstrap 得到，记作 $V_g(t)$。各目标先在全部候选方案上做极差归一化为 $\\\\widetilde R,\\\\widetilde L,\\\\widetilde V,\\\\widetilde K\\\\in[0,1]$，再最小化\\n\\n$$\\n\\\\min_{G,\\\\boldsymbol\\\\tau}J=\\n\\\\lambda_{\\\\rm fail}\\\\widetilde R+\\n\\\\lambda_{\\\\rm delay}\\\\widetilde L+\\n\\\\lambda_{\\\\rm unc}\\\\widetilde V+\\n\\\\lambda_{\\\\rm comp}\\\\widetilde K, \\\\tag{14}\\n$$\\n\\n其中\\n\\n$$\\nR=\\\\sum_g\\\\pi_g[1-p_g(\\\\tau_g)],\\\\quad\\nL_{\\\\rm all}=\\\\sum_g\\\\pi_gL(\\\\tau_g),\\\\quad\\nV=\\\\sum_g\\\\pi_gV ... [truncated 1735 characters] ... our objectives over all feasible candidates\\nselect minimum J; evaluate once on held-out patients\\n```\\n\\n### 6.4 基准、误差传播与结果输出\\n\\n解析可行基准取题面建议区间与 `max(该组经验90%首达标分位数,10)`，再投影到 $[10,25]$；若不满足概率约束则顺延到最早满足时点。动态规划结果的 $J$ 不应劣于该基准。另以单组方案作为永远可比较的朴素基准；多组方案若没有降低外层验证的失败加延迟损失至少 2%，选更少组。\\n\\n检测误差从同次技术重复估计 $\\\\widehat\\\\sigma_{tech}$，作 500 次 Monte Carlo：\\n\\n$$\\ny_{ij}^{(m)}=y_{ij}+\\\\varepsilon_{ij}^{(m)},\\\\qquad\\n\\\\varepsilon_{ij}^{(m)}\\\\sim N(0,\\\\widehat\\\\sigma_{tech}^2). \\\\tag{18}\\n$$\\n\\n每次重新构造 $D_{ij}$、拟合达标模型并优化。另扰动阈值 $0.035,0.040,0.045$、$p_0=0.80,0.85,0.90,0.95$ 及三组风险权重。输出每组 BMI 区间、患者数、$\\\\tau_g$、$p_g(\\\\tau_g)$、95% 区间、目标分解和边界/时点被选中的 Bootstrap 频率。\\n\", \"ok\": true}"
