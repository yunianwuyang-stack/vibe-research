                - generic [ref=e2224]: "[tool] replace {\"new_text\": \"统一记 $S_i(t)=1-F_i(t)$，则删失似然可写为\\n\\n$$\\n\\\\mathcal L_i=\\n\\\\begin{cases}\\nF_i(\\\\xi_1), & \\\\text{左删失},\\\\\\\\\\nF_i(\\\\xi_k)-F_i(\\\\xi_{k-1}), & \\\\text{区间删失 } I_k,\\\\\\\\\\nh_i(k)\\\\prod_{r<k}[1-h_i(r)], & \\\\text{精确事件于 } I_k,\\\\\\\\\\nS_i(c_i), & \\\\text{右删失于 } c_i.\\n\\\\end{cases} \\\\tag{11}\\n$$\\n\\n这样未达标者不会被伪造事件。BMI 组 $G_g=[c_{g-1},c_g)$ 的标准化累计达标概率为\", \"old_text\": \"模型拟合使用删失类型对应的似然：左删失于 $\\\\xi_1$ 的贡献为 $F_i(\\\\xi_1)$；区间删失于 $(\\\\xi_{k-1},\\\\xi_k]$ 的贡献为 $F_i(\\\\xi_k)-F_i(\\\\xi_{k-1})$；精确记录为达标的贡献为 $h_i(k)\\\\prod_{r<k}[1-h_i(r)]$；右删失于 $c_i$ 的贡献为 $1-F_i(c_i)$。所有贡献均取对数后求和，因而未达标者不会被伪造事件时间。模型内部使用事件驱动的实际观测区间；只有最终推荐时点为便于临床执行而投影到 $\\\\{10,10.5,\\\\ldots,25\\\\}$ 周，并用 $0.25$ 周输出粒度复算。推荐周改变不超过 $0.5$ 周才判定时间分辨率通过。\", \"path\": \"MODELING_REPORT.md\", \"replace_all\": false}"
