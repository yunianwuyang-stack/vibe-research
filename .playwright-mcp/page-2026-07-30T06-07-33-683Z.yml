                - generic [ref=e852]: "[tool result] read: {\"path\": \".vibe-skills/comp-code/references/checks/prediction.md\", \"start_line\": 1, \"end_line\": 55, \"total_lines\": 55, \"content\": \"# 预测类自检（时间序列/回归/分类必读）\\n\\n## 专项检查清单\\n\\n```\\nP1. [过拟合] 训练集 vs 测试集精度差距是否异常？\\n 一般 <10%, 但物理仿真等确定性问题 R²>0.99 可能正常\\nP2. [预测范围] 预测值是否在合理范围内？\\n 结合领域知识判断, 不是简单看历史极值\\nP3. [多步衰减] 远期预测精度是否合理下降？\\nP4. [残差检验] 残差是否有明显的模式（自相关/异方差）？\\nP5. [验证方式] 验证方式是否合理？\\n 时间序列不能随机 split, 应该用滚动验证\\nP6. [拟合太差] ⛔ R² < 0.5 的曲线拟合/回归模型绝对不能直接用！必须诊断：\\n - 模型形式是否正确？（是否遗漏基线漂移、非线性项、相位偏移）\\n - 数据预处理是否正确？（去趋势、归一化、截取有效区间）\\n - 初始参数是否合理？（非线性拟合对初值敏感）\\n 物理/工程拟合 R² 应 > 0.8, 社科截面回归 R² 在 0.2-0.6 可接受\\n```\\n\\n## 常见 Bug\\n\\n```\\nM1. [线性假设] 用线性回归拟合明显非线性的数据？（看残差图是否有弯曲模式）\\nM2. [样本不平衡] 分类问题中各类样本量是否严重不平衡？是否用了 class_weight 或过采样？\\nM3. [特征缩放] SVM/KNN/神经网络等距离敏感模型是否做了特征缩放？\\nM4. [时序交叉验证] 时间序列是否用了普通 k-fold？（应该用 TimeSeriesSplit, 不能未来数据预测过去）\\nM5. [多重比较] 做了多次假设检验是否做了 Bonferroni 校正？\\n```\\n\\n## 红旗信号\\n\\n| 现象 | 可能原因 |\\n|------|---------|\\n| R² > 0.99 但样本量 < 100 | 过拟合或数据泄漏 |\\n| 训练 R² 高、测试 R² 低 | 过拟合 |\\n| 预测值超出历史数据范围 5 倍以上 | 模型外推发散/趋势项过强 |\\n| 远期预测单调发散（不收敛不震荡） | 模型不稳定/缺阻尼项 |\\n| 残差与预测值相关 | 模型欠拟合 / 非线性遗漏 |\\n| 残差自相关 | 漏了滞后项 / AR 结构 |\\n\\n## 必产数据（供 paper-figure）\\n\\n```json\\n{\\n \\\"metrics\\\": {\\\"r2\\\": 0.85, \\\"rmse\\\": 1.23, \\\"mae\\\": 0.92},\\n \\\"train_test_gap_pct\\\": 5.2,\\n \\\"n_train\\\": 100,\\n \\\"n_test\\\": 30,\\n \\\"validation_method\\\": \\\"TimeSeriesSplit / k-fold / holdout\\\",\\n \\\"predictions\\\": [...],\\n \\\"actuals\\\": [...],\\n \\\"residuals\\\": [...]\\n}\\n```\\n\", \"ok\": true}"
