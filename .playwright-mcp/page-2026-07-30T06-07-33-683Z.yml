                - generic [ref=e2240]: "[tool] replace {\"new_text\": \"方法依据采用可核验的经典体系：Wood（2017）的惩罚样条与广义加性模型用于非线性纵向效应；Tutz 与 Schmid（2016）的离散时间事件史框架用于区间删失/右删失的首达标时间；Steyerberg（2019）的临床预测模型原则用于患者级验证、校准与过拟合控制；Vickers 与 Elkin（2006）的决策曲线用于阈值净收益评价。方法选择按本题样本结构而非算法新颖性决定：记录数约千级、患者内重复、事件时间仅在两次检测之间可定位，因此问题一优先半参数混合模型，问题二/三优先可直接写入删失似然且能输出累计概率的离散时间模型，问题四优先小样本下稳定、可校准且可解释的惩罚 Logistic。完整书目信息在论文参考文献中统一列出。\", \"old_text\": \"方法依据采用公开经典体系：Wood 的惩罚样条与 GAM；Allison 的离散时间事件史模型；Harrell 的患者级预测模型验证与校准；Vickers--Elkin 的决策曲线。当前工作区没有联网 WebSearch 接口，也未暴露可执行的 `$SCHOLAR_SCRIPT` 路径，因此本阶段不虚构 DOI；论文阶段应补录上述原始文献的完整书目信息。\", \"path\": \"MODELING_REPORT.md\", \"replace_all\": false}"
