                - generic [ref=e4396]: "[tool result] read: {\"path\": \"PROBLEM_ANALYSIS.md\", \"start_line\": 121, \"end_line\": 240, \"total_lines\": 370, \"content\": \"需要输出：按 Sheet 和性别分层的缺失率、孕周/BMI/年龄/读段数分布，男胎 Y 浓度按孕周和 BMI 的分箱分布，同一孕妇检测次数频数，AB 异常类型频数，质量指标的异常比例，以及重复记录的一致性检查。此处只做描述性统计，不预先拟合或优化。\\n\\n## 七、变量定义与符号表\\n\\n| 符号 | 含义 | 单位 | 类型 |\\n|---|---|---|---|\\n| $i$ | 孕妇索引 | 无 | 离散 |\\n| $j$ | 孕妇 $i$ 的第 $j$ 次检测 | 次 | 离散 |\\n| $t_{ij}$ | 检测孕周 | 周 | 连续 |\\n| $b_i$ | 孕妇 BMI | kg/m$^2$ | 连续 |\\n| $a_i$ | 年龄 | 岁 | 连续 |\\n| $h_i$ | 身高 | cm | 连续 |\\n| $w_{ij}$ | 体重 | kg | 连续 |\\n| $y_{ij}$ | Y 染色体浓度 | 比例 | 连续 |\\n| $z^Y_{ij}$ | Y 染色体 Z 值 | 无 | 连续 |\\n| $q_{ij}$ | 测序质量综合分数 | 无 | 连续 |\\n| $r_{ij}$ | 原始读段数 | 个 | 计数 |\\n| $m_{ij}$ | 参考基因组比对比例 | 比例 | 连续 |\\n| $d_{ij}$ | 重复读段比例 | 比例 | 连续 |\\n| $u_{ij}$ | 唯一比对读段数 | 个 | 计数 |\\n| $g_{ij}$ | 总 GC 含量 | 比例 | 连续 |\\n| $f_{ij}$ | 被过滤读段比例 | 比例 | 连续 |\\n| $x_{ij}$ | X 染色体浓度 | 比例 | 连续 |\\n| $z^X_{ij}$ | X 染色体 Z 值 | 无 | 连续 |\\n| $z^{13}_{ij},z^{18}_{ij},z^{21}_{ij}$ | 13/18/21 号染色体 Z 值 | 无 | 连续 |\\n| $g^{13}_{ij},g^{18}_{ij},g^{21}_{ij}$ | 13/18/21 号染色体 GC 含量 | 比例 | 连续 |\\n| $A_{ij}$ | AB 列异常标签 | 0/1及类型 | 标签 |\\n| $H_i$ | AE 出生后健康结果 | 0/1 | 外部标签 |\\n| $n_i$ | 孕妇检测次数 | 次 | 计数 |\\n| $T_i$ | 男胎可靠达标时间 | 周 | 生存/删失变量 |\\n| $D_{ij}$ | 单次检测是否达到 $4\\\\%$ | 0/1 | 指示变量 |\\n| $p_g(t)$ | BMI 组 $g$ 在孕周 $t$ 的达标概率 | 比例 | 函数 |\\n| $L(t)$ | 孕周风险损失 | 无 | 分段函数 |\\n| $c_g,d_g$ | BMI 组 ... [truncated 2530 characters] ... 误报代价为原则，并报告阈值敏感性。\\n\\n### 9.5 反向对照表\\n\\n| 模型组件 | 对应题面 | 额外假设/说明 |\\n|---|---|---|\\n| 孕周、BMI、Y 浓度 | S2、S3、S5 | 直接由附件字段得到 |\\n| 分段风险函数 $L(t)$ | S4 | 风险权重需通过情景分析标定，不宣称是临床真实概率 |\\n| 孕妇随机效应 | S7、S10 | 由重复检测机制引入，保留聚类稳健方案 |\\n| 右删失首达标时间 | S3、S8、S9 | 25 周仍未达标视为观测窗口内未达标 |\\n| AB 分类标签 | S14 | 题面明确要求，AE 只外部验证 |\\n| 读段/GC 质控 | 附录1、S9 | 质控阈值需做敏感性而非无依据硬删 |\\n\\n### 9.6 经典问题升级判定\\n\\n| 初步映射 | 触发句子 | 最终模型 | 严重性 | 必须性 | 缺参数预案 |\\n|---|---|---|---|---|---|\\n| 普通回归 | 多次采血、多次检测 | 混合效应/聚类稳健模型 | 致命 | 必须 | 若技术重复不足，至少按孕妇聚类 Bootstrap |\\n| 普通分箱 | 最佳时点与潜在风险 | 风险加权的分组-时点优化 | 重要 | 必须 | 风险权重取多个情景并报告排名稳定性 |\\n| 普通分类 | AB 指定判定且异常稀少 | 代价敏感、校准分类 | 重要 | 必须 | 用类别权重、PR-AUC 和阈值敏感性 |\\n\", \"ok\": true}"
