                - generic [ref=e1600]: "[tool result] read: {\"path\": \"MODELING_REPORT.md\", \"start_line\": 1, \"end_line\": 144, \"total_lines\": 144, \"content\": \"# NIPT 检测时点选择与胎儿异常判定建模报告\\n\\n## 1. 建模任务、数据层级与总体路线\\n\\n本报告针对 4 个子问题建立“质量控制 - 层级统计建模 - 风险决策 - 患者级验证”的统一框架。附件含男胎 1082 条检测记录、女胎 605 条检测记录；记录不是独立样本，同一孕妇可多次采血，且同一次采血可重复测序。因此所有模型以孕妇代码 $i$ 为聚类单元，以记录 $j$ 为观测单元，训练、验证和 Bootstrap 均不得拆散同一孕妇。\\n\\n题面硬机制统一写为\\n\\n$$\\n10\\\\le t_{ij}\\\\le25,\\\\qquad D_{ij}=I(y_{ij}\\\\ge0.04),\\\\qquad A_{ij}=I(AB_{ij}\\\\ne\\\\varnothing). \\\\tag{1}\\n$$\\n\\n其中浓度均用比例而非百分数。题面“12 周以内、13--27 周、28 周以后”的临床风险分层与本题可检测窗口并不完全重合：在 $[10,25]$ 内只能出现早期和中期，晚期仅作为窗口外极端审计，不允许优化器选择 25 周以后的时点。\\n\\n总体数据流为：解析两个 Sheet -> 单位和日期一致性检查 -> 建立质控标记但不先删标签 -> 按性别分流 -> 男胎问题 1 的浓度模型 -> 问题 2/3 的达标概率与时点决策 -> 女胎问题 4 的代价敏感分类 -> 按孕妇外层验证及 AE 外部一致性检查。\\n\\n### 1.1 对赛题分析“经典问题升级”的逐条决策\\n\\n| 升级建议 | 触发原因与影响 | 本报告决策 | 核心机制如何保留 |\\n|---|---|---|---|\\n| 普通回归 -> 混合效应/聚类稳健模型 | 多次采血和技术重复造成组内相关；忽略会低估标准误 | 完整采用 | 患者随机截距、同日技术误差、患者级 Bootstrap |\\n| 普通分箱 -> 风险加权分组-时点优化 | 均值首达标不能反映早发现收益和未达标风险 | 完整采用 | 达标概率约束、分段时间损失、边界与时点联合优化 |\\n| 普通分类 -> 代价敏感校准分类 | 异常稀少且漏诊代价高；准确率会误导 | 完整采用 | 类别权重、校准概率、按代价选择阈值、PR-AUC |\\n| 完整观测回归 -> 右删失/失败机制 | 25 周内未达标或测序失败不能被伪造成事件 | 完整采用 | 右删失生存似然、失败概率模型、IPC 权重敏感性 |\\n\\n没有否决任何升级。缺少临床风险权重不是跳过风险决策的理由：风险分量先归一化，再用低、中、高漏诊代价三个预设情景，主情景固定为“漏诊成本高于延迟成本”，并对权重做敏感性分析。缺少统一“测序失败”阈值时，采用数据驱动质控标记和失败模型，不用硬删除代替失败机制。\\n\\n### 1.2 方法调研与选择依据\\n\\n问题 1 采用广义加性混合模型（GAMM） ... [truncated 4362 characters] ... | 测量误差 | 比例 | 零均值实数 | 第5节 |\\n| $T_i$ | 首次可靠达标时间 | 周 | $[10,25]$ 或右删失 | 第6节 |\\n| $h_i(k)$ | 第 $k$ 个孕周区间的离散风险率 | 比例 | $[0,1]$ | 第6节 |\\n| $F_i(t)$ | 截至 $t$ 首达标累计概率 | 比例 | $[0,1]$ | 第6节 |\\n| $G_g$ | 第 $g$ 个 BMI 区间 | kg/m$^2$ | 有序区间 | 第6节 |\\n| $c_g$ | BMI 分组边界 | kg/m$^2$ | 数据范围内 | 第6节 |\\n| $\\\\tau_g$ | 第 $g$ 组推荐时点 | 周 | $[10,25]$ | 第6节 |\\n| $p_g(t)$ | 第 $g$ 组在 $t$ 前可靠达标概率 | 比例 | $[0,1]$ | 第6节 |\\n| $L(t)$ | 归一化时点延迟损失 | 无 | $[0,1]$ | 第6节 |\\n| $J$ | 综合决策目标 | 无 | $[0,1]$ | 第6节 |\\n| $\\\\theta$ | 女胎异常判定阈值 | 概率 | $[0,1]$ | 第8节 |\\n| $\\\\widehat\\\\pi$ | 女胎异常预测概率 | 概率 | $[0,1]$ | 第8节 |\\n| $C_{FN},C_{FP}$ | 漏诊、误报相对代价 | 无 | 正实数 | 第8节 |\\n\\n<!-- APPEND -->\", \"ok\": true}"
