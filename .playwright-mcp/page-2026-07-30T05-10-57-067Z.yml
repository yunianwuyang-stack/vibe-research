                - generic [ref=e1572]: "[tool result] read: {\"path\": \"CLAUDE.md\", \"start_line\": 1, \"end_line\": 140, \"total_lines\": 142, \"content\": \"# 研究项目: NIPT 的时点选择与胎儿的异常判定\\n\\n## 项目说明\\n这是一个自动化研究管理的工作流引擎，当前正在执行「国赛数学建模 (CUMCM)」流水线。\\n\\n## 流水线步骤\\n 1. 赛题分析 (comp-prob-analysis)\\n 2. 建模求解 (comp-modeling)\\n 3. 编程实现 (comp-code)\\n 4. 图表生成 (paper-figure)\\n 5. 流程与架构图绘制 (paper-figure-html)\\n 6. 竞赛论文撰写 (comp-paper-zh)\\n 7. 编译与合规检查 (comp-compile-zh)\\n\\n## 重要规则\\n- 所有产出文件都写入当前工作目录（不要写到其他位置）\\n- 使用 Write 工具创建文件，如果文件太长则用 Bash 的 cat << 'EOF' > file 方式\\n- 每个步骤完成后至少产出一个文件\\n- 读取工作区中已有的文件，在前步骤的基础上继续工作\\n- 使用中文撰写正文（除非是 LaTeX 代码）\\n\\n## 工作区已有文件\\n- MODELING_REPORT.md\\n- PROBLEM_ANALYSIS.md\\n- user_data/C题.pdf\\n- user_data/C题.pdf.txt\\n- user_data/附件.xlsx\\n- user_data/附件.xlsx.txt\\n请仔细阅读并利用这些文件作为研究基础。\\n\\n## 用户上传文件分类\\n### 数据集 / 附件数据 (data)\\n- user_data/附件.xlsx\\n### 赛题 (problem)\\n- user_data/C题.pdf\\n必须按上述角色理解材料；已有结果和图表不得被编造内容覆盖。\\n\\n## 参数\\n- 研究主题: NIPT 的时点选择与胎儿的异常判定\\n- template: comp_cumcm\\n- skip_improvement_loop: True\\n- competition: cumcm\\n- language: zh\\n- max_pages: 30\\n- output_format: pdf\\n- flowchart_engine: html\\n- rich_mode: False\\n- tools: python\\n- min_figures: auto\\n- min_tables: auto\\n- min_models: auto\\n- figure_style: default\\n- validation_mode: strict\\n- require_competition_input: True\\n- research_question: NIPT 的时点选择与胎儿的异常判定\\n- inclusion_criteria: 仅接受附件xl ... [truncated 1652 characters] ... 几何体的哪些边界（如'圆柱体上下底面圆周 300 点'）\\n\\n⛔ 论文深度与求解精度（提升论文质量）：\\n- 关键假设必须有数学证明或文献支撑（≥1个定理/引理），不能只写'为简化假设XXX'\\n- 求解精度必须与方法匹配：连续问题用二分/牛顿（精度≥1e-6），禁止固定步长=0.01作为最终结果\\n- 核心结果必做双算法交叉验证（几何解析+启发式 / DE+PSO / 精确+近似）\\n- 高维优化（维度≥10）必须先做几何/物理降维，禁止直接喂黑箱算法\\n\\n⛔ 多资源协同优化（防止资源闲置陷阱）：\\n- 多资源（多弹/多机/多点）必须用联合目标函数，不能独立优化后叠加\\n- 检测到'某个资源T=0/覆盖=0/贡献=0' → 说明被误判放弃，必须修\\n- 检测到'两个资源作用区间完全不重叠' → 没利用互补性，必须改\\n- 启发式算法必须有几何/物理启动种子（≥5个），禁止纯随机初始化\\n- 多阶段问题必须分层（任务分配+子任务优化），禁止把所有维度混在一起全量搜索\\n\\n⛔ 建模与优化有效性约束（通用）：\\n- 资源单调性：更多决策资源→结果必须严格更优，否则建模降维失败\\n- 解析基准下界：启发式优化解必须优于解析/几何/贪心基准，否则算法失败\\n- 搜索空间健康度：维度≥6时先采样100点，有效解<30%则必须降维或启发式播种\\n- 维度分层：决策变量≥10维时禁止单层黑箱优化，必须分层分解\\n\\n检测到问题 = 必须修复。解释原因 ≠ 处理完毕。\\n\", \"ok\": true}"
