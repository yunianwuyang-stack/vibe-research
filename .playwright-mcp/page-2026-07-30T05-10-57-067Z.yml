                - generic [ref=e1520]: 建模方案将固定为：问题1采用 GAMM 主模型并以线性混合模型交叉验证；问题2采用 BMI 单因素离散时间生存模型和有序分组动态规划；问题3升级为多因素层级离散风险模型与测量误差传播下的稳健联合优化；问题4采用代价敏感弹性网 Logistic，并用梯度提升作独立非线性对照。所有切分、插补、标准化、校准和阈值选择都在孕妇级嵌套交叉验证内部完成。
