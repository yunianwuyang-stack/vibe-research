                - generic [ref=e1244]: "[tool result] read: {\"path\": \"_utils/error_prevention.md\", \"start_line\": 1231, \"end_line\": 1450, \"total_lines\": 2313, \"content\": \"# 十二、数据切分 / 时间穿越 / 数据泄露\\n\\n> ⛔ **本章解决一类典型 bug：训练集 99% 准确率，测试集 60%；或测试集泄露了未来信息让结果过于\\\"亮眼\\\"。**\\n> 通用规范，适用于任何含训练 / 测试 / 预测 / 反事实推断 / 因果识别的题目。\\n\\n## 12.1 三类典型陷阱\\n\\n### 陷阱 A：特征工程在切分前 fit（数据泄露）\\n- 用全量数据算的均值 / 方差对训练 + 测试统一标准化（`StandardScaler().fit_transform(all_X)`）。\\n- PCA / 特征选择在切分前做（用了测试集的信息选特征）。\\n- 标签编码 / 类别处理在切分前做（测试集出现训练集没见过的类别时漏处理）。\\n\\n### 陷阱 B：时序数据用了乱序切分\\n- 时间序列预测用 `KFold(shuffle=True)`，未来数据进了训练集。\\n- 用历史数据预测未来，但特征里偷偷包含了未来时刻的 lag（`feature.shift(-1)`）。\\n- 时间窗口滑动时 train/test 重叠。\\n\\n### 陷阱 C：评测口径错位\\n- 训练时用 RMSE，测试时报 MAPE，二者最优解不同。\\n- 训练集做了去极值，测试集没做，分布偏移导致泛化错觉。\\n- 多次实验只报最好的那次（\\\"暗 cherry-pick\\\"）。\\n\\n## 12.2 五条强制复核\\n\\n| # | 规则 | 落地形式 |\\n|---|---|---|\\n| 1 | **切分一律在最早期** | `train, test = split(data)` 必须在任何 `fit()` 之前 |\\n| 2 | **时序题严格按时间切**（禁止 shuffle） | 用 `TimeSeriesSplit` 或显式按时间索引切 |\\n| 3 | **特征工程必须 fit on train, transform on test** | `scaler.fit(X_train); scaler.transform(X_test)`，不能 `fit_transform(X_all)` |\\n| 4 | **未来信息检测** | 对每个特征检查 `feature.shift(<0)` / 未来时间戳 / 标签直接相关性 |\\n| 5 | **评测口径单一且事先声明** | PROBLEM_ANALYSIS.md 写明\\\"主指标 = RMSE，辅助 = MAE\\\"；测试不许换 |\\n\\n## 12.3 通用数据泄露审计模板\\n\\n```python\\n# leakage_audit.py — 数据泄露与时间穿越审计\\nimport pandas as pd\\nimport numpy as np\\nfrom pathlib import Path\\ ... [truncated 6316 characters] ... tol。\\\"\\\"\\\"\\n if len(history) < 20:\\n return {'audit_pass': False, 'fails': [f\\\"收敛历史仅 {len(history)} 代，太短\\\"]}\\n fbest = [h['best'] for h in history]\\n n = len(fbest)\\n window = max(1, int(n * window_frac))\\n recent = fbest[-window:]\\n rel = (recent[0] - recent[-1]) / max(abs(recent[0]), 1e-10)\\n fails = []\\n if rel > tol_rel:\\n fails.append(f\\\"最后 {window_frac:.0%} 代仍下降 {rel:.2%}（可能过早终止）\\\")\\n return {'audit_pass': len(fails) == 0, 'fails': fails, 'final_rel_drop': rel}\\n\\n\\ndef audit_mcmc_chain(samples_per_chain: list[np.ndarray]) -> dict:\\n \\\"\\\"\\\"MCMC 多链 Gelman-Rubin R̂ 审计（应 < 1.1）。\\\"\\\"\\\"\\n\", \"ok\": true}"
