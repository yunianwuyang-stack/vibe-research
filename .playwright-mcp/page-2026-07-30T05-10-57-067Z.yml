                - generic [ref=e1832]: "[tool result] read: {\"path\": \"PROBLEM_ANALYSIS.md\", \"start_line\": 241, \"end_line\": 360, \"total_lines\": 370, \"content\": \"| 完整观测回归 | 测序失败和未达标 | 右删失/失败机制分析 | 重要 | 必须 | 未给失败判定阈值时，以质量分位数和完整案例做敏感性 |\\n\\n## 十、硬约束清单（HARD_CONSTRAINTS）\\n\\n| 编号 | 自然语言描述 | 数学表达（一行可执行） | 涉及变量 | 类型 |\\n|---|---|---|---|---|\\n| C1 | NIPT 可检测孕周范围 | `$10 \\\\le t \\\\le 25$` | $t_{ij}$ | 静态 |\\n| C2 | 男胎基本准确阈值 | `$D_{ij}=1[y_{ij}\\\\ge0.04]$` | $y_{ij},D_{ij}$ | 动态 |\\n| C3 | BMI 分组有序且不重叠 | `$c_0<c_1<...<c_G,\\\\;G_g=[c_{g-1},c_g)$` | $c_g$ | 静态 |\\n| C4 | 每个孕妇只归属一个 BMI 组 | `$\\\\sum_g1[b_i\\\\in G_g]=1$` | $b_i,G_g$ | 静态 |\\n| C5 | 推荐时点属于检测窗口 | `$10\\\\le\\\\tau_g\\\\le25$` | $\\\\tau_g$ | 静态 |\\n| C6 | 可靠达标概率达最低水平 | `$p_g(\\\\tau_g)\\\\ge p_0$` | $p_g,\\\\tau_g$ | 动态 |\\n| C7 | 未达标样本不能伪造达标时间 | `$T_i=\\\\text{right-censored}$ if \\\\max_j y_{ij}<0.04$` | $T_i,y_{ij}$ | 时变 |\\n| C8 | 女胎 Y 字段不参与异常分类 | `$\\\\text{feature}_q\\\\not\\\\ni y,z^Y$ for female$` | 女胎特征 | 静态 |\\n| C9 | AB 标签由 13/18/21 异常字段生成 | `$A=1[AB\\\\ne\\\\varnothing]$` | $AB,A$ | 静态 |\\n| C10 | 重复记录同一孕妇聚类 | `$\\\\text{split}(i)\\\\text{ is identical for all }j$` | $i,j$ | 静态 |\\n| C11 | 质量阈值不应替代原始标签 | `$AB\\\\text{ retained before/after QC}$` | $AB,s$ | 机动 |\\n\\n说明：GC 40%--60% 是题面给出的正常范围，作为质量警戒规则而非无条件硬删条件；后续必须同时报告不同 GC 质控阈值下的结果。题面可量化参数少于 20 个，本题不触发 `PROBLEM_FACTS.json` 和 `PARAMS_RAW.md` 的参数密集型强制门槛。\\n\\n## 十一、图表预规划\\n\\n图表全部读取真实计算结果和附件数据， ... [truncated 3650 characters] ... T）\\n\\n**数据图（matplotlib gen_fig_*.py，paper-figure 产出 .png/.pdf）：**\\n- fig_eda_quality_overview\\n- fig_q1_y_week_bmi_scatter\\n- fig_q1_y_week_curve\\n- fig_q1_corr_heatmap\\n- fig_q1_residual_diag\\n- fig_q2_bmi_distribution\\n- fig_q2_attainment_curves\\n- fig_q2_group_timing\\n- fig_q2_error_sensitivity\\n- fig_q3_feature_importance\\n- fig_q3_model_compare\\n- fig_q3_pareto_front\\n- fig_q3_robustness\\n- fig_q4_confusion_matrix\\n- fig_q4_roc_pr\\n- fig_q4_calibration\\n- fig_q4_risk_score\\n\\n**DrawIO 流程/架构图（paper-figure-drawio 产出 .drawio + .png/.pdf）：**\\n- fig_roadmap\\n- fig_flow_q1\\n- fig_flow_q2\\n- fig_flow_q3\\n- fig_flow_q4\\n- fig_pipeline\\n\", \"ok\": true}"
