C 40%--60% 是题面给出的正常范围，作为质量警戒规则而非无条件硬删条件；后续必须同时报告不同 GC 质控阈值下的结果。题面可量化参数少于 20 个，本题不触发 `PROBLEM_FACTS.json` 和 `PARAMS_RAW.md` 的参数密集型强制门槛。\\n\\n\", \"ok\": true}"
