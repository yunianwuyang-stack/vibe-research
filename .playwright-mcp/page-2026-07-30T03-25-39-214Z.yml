                - generic [ref=e1126]: "[tool] replace {\"new_text\": \"6. **分类与决策分离**：问题4先做质控，再做异常概率预测；问题2/3先估计达标概率，再优化时点，避免把优化规则直接当作统计事实。\\n\\n## 九、各子问题建模思路\\n\\n### 9.1 问题1：Y 浓度关系模型与显著性\\n\\n**响应变量**为 $y_{ij}$，主要自变量为 $t_{ij}$ 和 $b_i$，控制年龄、身高、体重、孕产次数、IVF 方式及测序质量。先画散点和分箱均值，再比较三类模型：\\n\\n- 基准模型：线性混合效应模型\\n $$\\n y_{ij}=\\\\beta_0+\\\\beta_1t_{ij}+\\\\beta_2b_i+\\\\beta_3t_{ij}b_i+\\\\boldsymbol\\\\gamma^T\\\\boldsymbol{x}_{ij}+u_i+e_{ij}.\\n $$\\n- 推荐模型：广义加性混合模型，用 $s_1(t)$、$s_2(b)$ 和交互平滑项表达非线性；通过限制有效自由度避免过拟合。\\n- 稳健模型：对浓度进行 Beta 回归或对异常值采用 Huber 损失；由于浓度可能接近 0 或有极少异常值，需与高斯混合模型比较。\\n\\n显著性检验包括整体孕周效应、BMI 效应、交互项和非线性项的似然比检验；用按孕妇聚类 Bootstrap 检查 p 值和置信区间稳定性。输出边际效应曲线，而不是仅给一个相关系数。\\n\\n### 9.2 问题2：只以 BMI 为核心的分组和时点\\n\\n先对每位男胎孕妇按孕周排序，构造首达标时间 $T_i$；达到检测上限仍未达标的样本视为右删失。用离散时间生存模型或 logistic 达标概率曲线估计\\n\\n$$\\n\\\\Pr(T_i\\\\le t\\\\mid b_i)=\\\\operatorname{logit}^{-1}\\\\{\\\\alpha_t+s(b_i)\\\\}.\\n$$\\n\\n对 BMI 候选分组 $G$ 和各组时点 $\\tau_g$，最小化\\n\\n$$\\nJ(G,\\\\tau)=\\\\sum_g\\\\pi_g\\\\left[\\\\lambda_1(1-p_g(\\\\tau_g))+\\\\lambda_2L(\\\\tau_g)+\\\\lambda_3\\\\operatorname{Var}(\\\\widehat p_g(\\\\tau_g))\\\\right]+\\\\lambda_4K(G),\\n$$\\n\\"
