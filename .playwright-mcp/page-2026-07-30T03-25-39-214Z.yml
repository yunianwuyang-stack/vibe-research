                - generic [ref=e1134]: "[tool] replace {\"new_text\": \"| S14 | AB、Z值、GC、读段已入表 | 分类器与阈值 | 是 | 致命 |\\n\\n## 六、数据探索与质量判断\\n\\n### 6.1 数据规模和字段\\n\\n附件文本显示存在两个 Sheet，均为 31 列：\\n\\n- Sheet 1：男胎数据，1,082 条检测记录；Y 染色体 Z 值和 Y 浓度有值。\\n- Sheet 2：女胎数据，605 条检测记录；Y 染色体 Z 值和 Y 浓度按定义为空。\\n- 合计 1,687 条检测记录。孕妇代码重复，说明观测单位是“检测记录”，分析单位还需要构造“孕妇级”数据。\\n- 主要字段可分为人口学变量（年龄、身高、体重、BMI、孕产次数）、时间变量（末次月经、检测日期、检测孕周、抽血次序）、测序质量变量（原始读段数、比对比例、重复比例、唯一比对读段数、GC、过滤比例）、染色体指标（13/18/21/X/Y 的 Z 值和浓度）、标签变量（AB、AE）。\\n\\n### 6.2 初步特征和数据质量\\n\\n1. 男胎 Y 浓度在较早孕周可出现低于 $4\\\\%$、负值或临界值，随孕周增加通常逐渐增大；应使用浓度原值建模，并将百分比统一为小数。\\n2. 同一孕妇一般有多次抽血，部分记录在同一孕周具有重复检测；应以 `孕妇代码` 做聚类键，以 `检测抽血次数` 和检测日期排序。\\n3. BMI 分布集中在高 BMI 区域，题目给出的示例区间 `[20,28)、[28,32)、[32,36)、[36,40)、40以上` 可作为初始分箱，但最终边界必须由样本量、风险曲线和交叉验证确定。\\n4. 女胎 X 浓度可为负值，题面已解释为估计量，不应按普通生理比例直接截断；应同时保留 X Z 值、X 浓度并检查二者关系。\\n5. AB 为空表示无异常，`T13`、`T18`、`T21` 及其组合表示异常类别；需要统一编码为二分类 `abnormal`，并保留异常类型多标签。\\n6. 测序质量字段存在明显的重复测量和极端质量记录，不能在建模前仅按均值填补；先定义质控标记，再做完整案例、插补和不剔除三种敏感性分析。\\n7. 末次月经、检测日期在文本中既有 Excel 日期序列也有日期字符串，必须先转为日期并以检测孕周字段作为主时间，同时用日期差进行一致性核查。\\n\\n### 6.3 描述性统计任务（留给后续代码实现）\\"
